<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACCESMAIL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("acm-theme");var d=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t||d);})();</script>
<style>
html[data-theme="dark"]{
  --bg:#020208; --bg2:#07080F; --surface:#0C0E1A; --surface2:#111323;
  --ink:#E2E4EF; --muted:#525870; --accent:#5B7FFF; --accent2:#A855F7;
  --accent-soft:rgba(91,127,255,0.13); --line:rgba(255,255,255,0.06);
  --danger:#FF5D52; --danger-soft:rgba(255,93,82,0.13);
  --success:#34D399; --glow:rgba(91,127,255,0.15); --p-op:1.0;
}
html[data-theme="light"]{
  --bg:#EDEEF5; --bg2:#E3E5F0; --surface:#FFFFFF; --surface2:#F3F4FA;
  --ink:#0E1020; --muted:#6B7080; --accent:#2952E3; --accent2:#7C3AED;
  --accent-soft:rgba(41,82,227,0.1); --line:rgba(0,0,0,0.07);
  --danger:#C2372B; --danger-soft:rgba(194,55,43,0.1);
  --success:#059669; --glow:rgba(41,82,227,0.08); --p-op:0.18;
}
:root{--r:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{ background:var(--bg); }
body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;transition:background .35s,color .35s;
}
/* Force dark mode everywhere */
html[data-theme="dark"] body,
html[data-theme="dark"] .screen,
html[data-theme="dark"]{
  background-color:var(--bg);
  color-scheme: dark;
}
html[data-theme="light"]{
  color-scheme: light;
}
input,select,textarea,button{
  color:var(--ink);background:transparent;
  font-family:'Inter',sans-serif;
}
input::placeholder{color:var(--muted);}
input:-webkit-autofill{
  -webkit-box-shadow:0 0 0 100px var(--bg2) inset;
  -webkit-text-fill-color:var(--ink);
}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.screen{
  position:relative;z-index:1;max-width:460px;margin:0 auto;
  min-height:100vh;padding:16px 18px 120px;
}
#shopScreen.hide,#cartScreen.hide,#adminScreen.hide{display:none;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.topbar-space{flex:1;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.icon-btn:active{transform:scale(0.92);}

/* PROFILE */
.profile-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.profile-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));
}
.avatar{
  width:46px;height:46px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:#fff;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;min-width:0;}
.profile-name{
  font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.profile-handle{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:1px;
}
.balance-block{text-align:right;}
.balance-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
}
.balance-val{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;
  color:var(--success);
}

/* HERO */
.hero{margin-bottom:16px;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;
}
.wordmark{
  font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:clamp(2rem,9vw,2.8rem);letter-spacing:-.02em;line-height:1;
  background:linear-gradient(110deg,var(--accent) 0%,var(--accent2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:8px;
}
.tagline{font-size:14px;line-height:1.55;color:var(--muted);max-width:34ch;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px 12px 42px;font-size:15px;
  outline:none;transition:border-color .15s;color:var(--ink);
}
.search-input:focus{border-color:var(--accent);}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px;pointer-events:none;
}
.search-count{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--muted);margin-bottom:12px;
}

/* COUNTRY CAROUSEL */
.section-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px;
}
.carousel-wrap{
  overflow-x:auto;scrollbar-width:none;
  padding:4px 0 12px;margin-bottom:6px;
}
.carousel-wrap::-webkit-scrollbar{display:none;}
.carousel{
  display:flex;gap:8px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.country-item{
  scroll-snap-align:center;flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 8px;cursor:pointer;
  min-width:68px;max-width:68px;
  transition:all .15s ease;
}
.country-item:active{transform:scale(0.93);}
.country-item.active{
  background:var(--accent-soft);border-color:var(--accent);
}
.c-flag{font-size:26px;line-height:1;}
.c-name{
  font-size:10px;color:var(--muted);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  width:60px;
}
.country-item.active .c-name{color:var(--accent);font-weight:600;}

/* CATALOG */
.catalog{display:flex;flex-direction:column;gap:10px;}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 16px;
  transition:border-color .15s,background .3s;
}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.card-domain{
  font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:15px;color:var(--accent);
}
.stock-tag{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  padding:3px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent);
}
.stock-tag.low{background:rgba(255,165,0,0.12);color:orange;}
.stock-tag.out{background:var(--danger-soft);color:var(--danger);}
.card-countries{font-size:12px;color:var(--muted);margin-bottom:12px;}
.card-bottom{display:flex;justify-content:space-between;align-items:center;}
.card-price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}

/* BUTTONS */
.btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:#fff;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  border:none;padding:10px 18px;border-radius:10px;cursor:pointer;
  transition:transform .15s,opacity .15s;
}
.btn:active{transform:scale(0.95);opacity:.9;}
.btn:disabled{opacity:.3;cursor:default;}
.btn-flat{background:var(--surface2);color:var(--ink);border:1px solid var(--line);}
.btn-danger{background:var(--danger) !important;}

.pricing-hint{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:10px;font-size:13px;color:var(--muted);
}
.pricing-hint .promo{
  color:var(--success);font-weight:600;
  background:rgba(52,211,153,0.1);padding:2px 8px;border-radius:999px;
  font-size:12px;
}
.trust{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  color:var(--muted);font-size:11px;margin-top:28px;
}

/* CART BAR */
.cart-bar{
  position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 50%,transparent);
  transform:translateY(130%);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:20;
}
.cart-bar.show{transform:translateY(0);}
.cart-bar-inner{
  width:100%;max-width:420px;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  color:#fff;border-radius:14px;padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;box-shadow:0 12px 32px rgba(91,127,255,.3);
}
.cbl{font-size:13px;opacity:.85;}
.cbr{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}

/* PAGES */
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.back-btn{
  background:var(--surface);border:1px solid var(--line);
  width:38px;height:38px;border-radius:10px;font-size:16px;
  cursor:pointer;color:var(--ink);flex:0 0 auto;
}
.page-title{
  font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:1.5rem;letter-spacing:-.01em;
}
.sec-lbl{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;
}

/* CART */
.cart-list{display:flex;flex-direction:column;gap:10px;}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
}
.ci-name{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:14px;color:var(--accent);margin-bottom:2px;}
.ci-unit{font-size:12px;color:var(--muted);}
.stepper{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
.stepper button{background:none;border:none;font-size:16px;width:20px;height:20px;color:var(--ink);cursor:pointer;}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:14px;text-align:center;}

.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:4px;}
.sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:5px 0;}
.sum-row.tot{
  color:var(--ink);font-weight:700;font-size:18px;
  font-family:'Space Grotesk',sans-serif;
  border-top:1px solid var(--line);margin-top:8px;padding-top:14px;
}

/* PAY */
.pay-tabs{display:flex;gap:8px;margin-bottom:12px;}
.pay-tab{
  flex:1;padding:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;text-align:center;transition:all .15s;
}
.pay-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.pay-panel{display:none;}
.pay-panel.active{display:block;}
.pay-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
.pay-net{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);
  background:var(--accent-soft);display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:12px;
}
.pay-addr{
  display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:12px;
}
.pay-addr span{font-family:'IBM Plex Mono',monospace;font-size:11px;word-break:break-all;flex:1;color:var(--ink);}
.copy-btn{
  background:none;border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink);flex:0 0 auto;
}
.pay-note{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.bal-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center;}
.bal-big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2.5rem;color:var(--success);margin:8px 0 4px;}
.bal-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}

/* ADMIN */
.lock-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;text-align:center;}
.lock-icon{font-size:36px;margin-bottom:12px;}
.lock-box p{font-size:13px;color:var(--muted);margin-bottom:14px;}
.field{
  width:100%;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;font-size:14px;color:var(--ink);
  outline:none;margin-bottom:10px;transition:border-color .15s;
}
.field:focus{border-color:var(--accent);}
.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;}
.admin-title{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--accent);margin-bottom:12px;font-weight:500;}
.admin-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.admin-row label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:58px;flex:0 0 auto;}
.admin-row .field{margin-bottom:0;padding:9px 12px;font-size:13px;}
.admin-acts{display:flex;gap:8px;margin-top:10px;}
.admin-acts .btn{flex:1;padding:9px;font-size:13px;}
.user-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.ur-av{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;
}
.ur-name{font-weight:500;font-size:14px;}
.ur-bal{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--success);}
.ur-act{margin-left:auto;}
.sm-btn{
  font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--ink);
}
.banner{
  background:var(--accent-soft);color:var(--accent);font-size:12px;
  padding:10px 14px;border-radius:10px;margin-bottom:14px;line-height:1.5;
  border:1px solid rgba(91,127,255,0.25);
}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);
  background:var(--surface2);color:var(--ink);border:1px solid var(--line);
  font-size:13px;font-weight:500;padding:12px 20px;border-radius:12px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:85%;text-align:center;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.2);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

function initMe(){
  try{

    if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){

      me = {
        id: "u"+u.id,

    } else {

    }

/* ============ PARTICLES (@, ✉) ============ */
(function(){
  const cv=document.getElementById("particles");
  const cx=cv.getContext("2d");
  const syms=["@","✉","@","@","✉","@","✉","@","@","✉"];
  const colors=["#7B9FFF","#C084FC","#A5B4FC","#E879F9","#60A5FA","#818CF8","#F472B6"];
  let w,h,dots=[];
  const reduced=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function isDark(){ return document.documentElement.getAttribute("data-theme")==="dark"; }
  function opacity(){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--p-op").trim())||0.5; }
  function resize(){ w=cv.width=window.innerWidth; h=cv.height=window.innerHeight; }
  function seed(){
    const n=Math.min(100,Math.floor(w*h/8000));
    dots=Array.from({length:n},()=>({
      sym:syms[Math.floor(Math.random()*syms.length)],
      col:colors[Math.floor(Math.random()*colors.length)],
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.55, vy:(Math.random()-.5)*.55,
      sz:22+Math.random()*36,
      op:0.75+Math.random()*.25,
      rot:Math.random()*Math.PI*2,
      rv:(Math.random()-.5)*.013
    }));
  }
  function draw(){
    cx.clearRect(0,0,w,h);
    const dark=isDark(), baseOp=opacity();
    dots.forEach(d=>{
      if(!reduced){
        d.x+=d.vx; d.y+=d.vy;
        if(d.x<-60||d.x>w+60)d.vx*=-1;
        if(d.y<-60||d.y>h+60)d.vy*=-1;
        d.rot+=d.rv;
      }
      cx.save();
      cx.translate(d.x,d.y);
      if(!reduced)cx.rotate(d.rot);
      if(dark){
        cx.shadowColor=d.col;
        cx.shadowBlur=d.sz*2.5;
      }
      cx.font="bold "+d.sz+"px 'Space Grotesk',sans-serif";
      cx.fillStyle=d.col;
      cx.globalAlpha=baseOp*d.op;
      cx.textAlign="center";
      cx.textBaseline="middle";
      cx.fillText(d.sym,0,0);
      // Double pass pour renforcer la visibilité en dark mode
      if(dark){
        cx.globalAlpha=(baseOp*d.op)*0.5;
        cx.fillText(d.sym,0,0);
      }
      cx.restore();
    });
    if(!reduced)requestAnimationFrame(draw);
  }
  window.addEventListener("resize",()=>{resize();seed();});
  resize();seed();draw();
})();

/* ============ DATA ============ */
function loadProducts(){
  const banner=document.getElementById("shopBanner");
  if(fbReady){
    banner.innerHTML="";
    db.ref("products").on("value",s=>{
      const v=s.val()||{};
      products=Object.entries(v).map(([id,p])=>({id,...p}));
      renderCarousel(); renderCatalog();
    });
  } else {
    banner.innerHTML='<div class="banner">Mode démo — configure Firebase pour le stock temps réel.</div>';
    products=SEED.map((p,i)=>({id:"s"+i,...p}));
    renderCarousel(); renderCatalog();
  }
}

/* ============ CAROUSEL PAYS ============ */
function activeCodes(){
  const s=new Set();
  products.forEach(p=>(p.countries||[]).forEach(c=>s.add(c)));
  return s;
}

function renderCarousel(){
  const el=document.getElementById("carousel");
  el.innerHTML="";
  const codes=activeCodes();

  // "Tous" en premier
  const all=document.createElement("div");
  all.className="country-item"+(activeCty==="all"?" active":"");
  all.innerHTML='<div class="c-flag">🌍</div><div class="c-name">Tous</div>';
  all.onclick=()=>{ activeCty="all"; renderCarousel(); renderCatalog(); };
  el.appendChild(all);

  // Pays qui ont des produits, dans l'ordre de ALL_COUNTRIES
  ALL_COUNTRIES.filter(c=>codes.has(c.c)).forEach(cty=>{
    const item=document.createElement("div");
    item.className="country-item"+(activeCty===cty.c?" active":"");
    item.innerHTML=`<div class="c-flag">${flag(cty.c)}</div><div class="c-name">${cty.n}</div>`;
    item.onclick=()=>{ activeCty=cty.c; renderCarousel(); renderCatalog(); };
    el.appendChild(item);
    // Auto-scroll to active
    if(activeCty===cty.c) setTimeout(()=>item.scrollIntoView({inline:"center",behavior:"smooth"}),50);
  });
}

/* ============ CATALOG ============ */
function filtered(){
  const q=query.trim().toLowerCase();
  return products.filter(p=>
    (q===""||p.domain.toLowerCase().includes(q))&&
    (activeCty==="all"||(p.countries||[]).includes(activeCty))
  );
}

function renderCatalog(){
  const items=filtered();
  const el=document.getElementById("catalog");
  document.getElementById("searchCount").textContent=items.length+(items.length>1?" acces trouvés":" acces trouvé");
  el.innerHTML="";
  if(!items.length){el.innerHTML='<p class="empty">Aucun acces ne correspond.</p>';return;}
  items.forEach(p=>{
    const stock=Number(p.stock||0);
    let sc="", sl=stock+" en stock";
    if(stock<=0){sc="out";sl="Épuisé";}
    else if(stock<=5){sc="low";sl="⚠ "+stock+" restants";}
    const ctyLabels=(p.countries||[]).map(c=>{
      const f=ALL_COUNTRIES.find(x=>x.c===c);
      return (f?flag(f.c)+" "+f.n:c);
    }).join("  ·  ");
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="card-top">
        <div class="card-domain">@${p.domain}</div>
        <span class="stock-tag ${sc}">${sl}</span>
      </div>
      <div class="card-countries">${ctyLabels}</div>
      <div class="card-bottom">
        <div class="card-price">${fmt(p.price)}</div>
        <button class="btn" ${stock<=0?"disabled":""}>Ajouter</button>
      </div>`;
    card.querySelector(".btn").onclick=()=>addToCart(p);
    el.appendChild(card);
  });
}

/* ============ CART ============ */
function addToCart(p){
  if((cart[p.id]||0)>=Number(p.stock||0)){showToast("Stock max atteint.");return;}
  cart[p.id]=(cart[p.id]||0)+1;
  haptic("light"); showToast("@"+p.domain+" ajouté."); renderCartBar();
}
function chQty(id,d){
  const p=products.find(x=>x.id===id);
  let n=(cart[id]||0)+d;
  if(n>Number(p?.stock||0))n=Number(p?.stock||0);
  if(n<=0)delete cart[id]; else cart[id]=n;
  renderCartBar(); renderCartPage();
}
function entries(){ return Object.entries(cart).map(([id,qty])=>({item:products.find(p=>p.id===id),qty})).filter(e=>e.item); }
function itemPrice(item,qty){ return qty>=10 ? 3.00 : Number(item.price||4); }
function total(){ return entries().reduce((s,e)=>s+itemPrice(e.item,e.qty)*e.qty,0); }
function count(){ return entries().reduce((s,e)=>s+e.qty,0); }
function renderCartBar(){
  const n=count();
  if(!n){document.getElementById("cartBar").classList.remove("show");return;}
  document.getElementById("cartBar").classList.add("show");
  document.getElementById("cartBarCount").textContent=n+(n>1?" articles":" article");
  document.getElementById("cartBarTotal").textContent=fmt(total())+" →";
}
function renderCartPage(){
  const es=entries();
  document.getElementById("cartList").innerHTML="";
  if(!es.length){
    document.getElementById("cartList").innerHTML='<p style="text-align:center;color:var(--muted);padding:50px 0">Ton panier est vide.</p>';
    document.getElementById("summaryBlock").innerHTML="";
    document.getElementById("payBlock").innerHTML=""; return;
  }
  es.forEach(({item,qty})=>{
    const row=document.createElement("div");
    row.className="cart-item";
    const unitP=itemPrice(item,qty);
    const isDiscount=qty>=10;
    row.innerHTML=`<div>
      <div class="ci-name">@${item.domain}</div>
      <div class="ci-unit">${fmt(unitP)} / unité${isDiscount?' <span style="color:var(--success);font-size:10px">✓ prix pro</span>':''}</div>
    </div>
      <div class="stepper"><button data-d="-1">−</button><span>${qty}</span><button data-d="1">+</button></div>`;
    row.querySelectorAll("button").forEach(b=>b.onclick=()=>chQty(item.id,parseInt(b.dataset.d)));
    document.getElementById("cartList").appendChild(row);
  });
  const tot=total();
  const canBal=myBalance>=tot;
  document.getElementById("summaryBlock").innerHTML=`
    <p class="sec-lbl">Résumé</p>
    <div class="sum-card">
      <div class="sum-row"><span>Articles</span><span>${count()}</span></div>
      <div class="sum-row"><span>Mon solde</span><span style="color:var(--success)">${fmt(myBalance)}</span></div>
      <div class="sum-row tot"><span>Total</span><span>${fmt(tot)}</span></div>
    </div>`;
  const addr=CRYPTO_CONFIG.address;
  document.getElementById("payBlock").innerHTML=`
    <p class="sec-lbl">Paiement</p>
    <div class="pay-tabs">
      <div class="pay-tab active" id="tSolde" onclick="swTab('solde')">💳 Solde</div>
      <div class="pay-tab" id="tCrypto" onclick="swTab('crypto')">₿ Crypto</div>
    </div>
    <div class="pay-panel active" id="pSolde">
      <div class="bal-box">
        <div style="font-size:13px;color:var(--muted)">Ton solde</div>
        <div class="bal-big">${fmt(myBalance)}</div>
        <div class="bal-sub">Total à payer : <b>${fmt(tot)}</b></div>
        ${canBal
          ? '<button class="btn" id="payBalBtn" style="width:100%;padding:14px">Payer avec mon solde</button>'
          : '<button class="btn" disabled style="width:100%;padding:14px;opacity:.35">Solde insuffisant</button><p style="font-size:12px;color:var(--muted);margin-top:8px;text-align:center">Recharge via crypto ou contacte le support.</p>'}
      </div>
    </div>
    <div class="pay-panel" id="pCrypto">
      <div class="pay-card">
        <span class="pay-net">${CRYPTO_CONFIG.network}</span>
        <div class="pay-addr"><span id="cryptoAddr">${addr}</span><button class="copy-btn" id="copyBtn">Copier</button></div>
        <p class="pay-note">Envoie <b>${fmt(tot)}</b> à cette adresse puis confirme ci-dessous.</p>
        <button class="btn" id="payFiatBtn" style="width:100%;padding:14px">J'ai envoyé le paiement</button>
      </div>
    </div>`;
  const pb=document.getElementById("payBalBtn");
  if(pb)pb.onclick=()=>doOrder("balance");
  document.getElementById("payFiatBtn").onclick=()=>doOrder("crypto");
  document.getElementById("copyBtn").onclick=()=>navigator.clipboard.writeText(addr).then(()=>showToast("Adresse copiée."));
}
function swTab(t){
  document.getElementById("tSolde").classList.toggle("active",t==="solde");
  document.getElementById("tCrypto").classList.toggle("active",t==="crypto");
  document.getElementById("pSolde").classList.toggle("active",t==="solde");
  document.getElementById("pCrypto").classList.toggle("active",t==="crypto");
}
function doOrder(method){
  const tot=total();
  if(method==="balance"){
    if(myBalance<tot){showToast("Solde insuffisant.");return;}
    if(fbReady&&me.id){
      db.ref("users/"+me.id+"/balance").set(parseFloat((myBalance-tot).toFixed(2)));
      entries().forEach(({item,qty})=>db.ref("products/"+item.id+"/stock").set(Math.max(0,Number(item.stock||0)-qty)));
    }
    showToast("Paiement effectué depuis ton solde !");
  } else {
    showToast("Confirmation envoyée — paiement en attente de vérification.");
  }
  haptic("medium"); cart={}; renderCartBar(); goShop();
}

const GENERIC_TLDS = new Set(['com','net','org','info','biz','app','io','pro','shop','store','online','site','mail','email','us']);

function parseMailPass(txt){
  const lines = txt.split('\n').map(l=>l.trim()).filter(l=>l && l.includes('@'));
  const seen = new Set();
  const grouped = {};
  let dupes = 0, invalid = 0;

  lines.forEach(line => {
    // Accepte mail:pass ou mail (sans pass)
    const sep = line.indexOf(':');
    const email = (sep > -1 ? line.slice(0,sep) : line).trim().toLowerCase();
    const pass  = sep > -1 ? line.slice(sep+1).trim() : '';

    if(!email.includes('@') || !email.includes('.')) { invalid++; return; }
    if(seen.has(email)) { dupes++; return; }
    seen.add(email);

    const domain = email.split('@')[1];
    const tld = domain.split('.').pop().toLowerCase();
    let country = TLD_MAP[tld] || null;
    if(!country) country = GENERIC_TLDS.has(tld) ? 'MIX' : tld.toUpperCase();

    const key = domain + '||' + country;
    if(!grouped[key]) grouped[key] = { domain, country, accounts:[] };
    grouped[key].accounts.push({ email, pass });
  });

  return { groups: Object.values(grouped), dupes, invalid, total: seen.size };
}

function importMailPass(groups, db){
  const updates = {};
  groups.forEach(g => {
    // Cherche un produit existant pour ce domaine + pays
    const existing = products.find(p => p.domain===g.domain && (p.countries||[]).includes(g.country));
    const prodRef = existing ? null : db.ref('products').push();
    const prodKey = existing ? existing.id : prodRef.key;
    const oldStock = existing ? Number(existing.stock||0) : 0;

    updates['products/'+prodKey] = {
      domain: g.domain,
      countries: [g.country],
      price: 4,
      stock: oldStock + g.accounts.length
    };

    g.accounts.forEach(acc => {
      const credRef = db.ref('credentials/'+prodKey).push();
      updates['credentials/'+prodKey+'/'+credRef.key] = {
        email: acc.email,
        pass: acc.pass,
        sold: false
      };
    });
  });
  return db.ref('/').update(updates);
}

const GENERIC_TLDS = new Set(['com','net','org','info','biz','app','io','co','us','tv','me','pro','shop','store','online','site','web','mail']);

function parseTxt(txt){
  const grouped = {};
  const skipped = [];
  const lines = txt.split('\n');

  lines.forEach(raw => {
    const line = raw.trim();
    if(!line || line.startsWith('#') || line.startsWith('//')) return;

    // Nettoie si c'est une adresse email complète (on ne garde que le domaine)
    const domainRaw = line.includes('@') ? line.split('@')[1].split(/[\s,|;]+/)[0] : line.split(/[\s,|;]+/)[0];
    const domain = domainRaw.toLowerCase().trim();
    if(!domain || !domain.includes('.')) return;

    const parts = line.replace(domainRaw,'').trim().split(/[\s,|;]+/).filter(Boolean);
    const tld = domain.split('.').pop();

    // Détection auto du pays via TLD
    let country = TLD_MAP[tld] || null;

    // Cherche un code pays explicite dans les autres tokens (ex: FR, US...)
    let price = null, stock = null;
    parts.forEach(p => {
      const up = p.toUpperCase();
      if(/^[A-Z]{2,3}$/.test(up) && !country && isNaN(p)) country = up;
      else if(!isNaN(parseFloat(p)) && parseFloat(p) < 200 && p.includes('.')) price = parseFloat(p);
      else if(!isNaN(parseInt(p)) && !p.includes('.') && parseInt(p) > 0) stock = parseInt(p);
    });

    // Si TLD générique et pas de pays → on ignore
    if(!country && GENERIC_TLDS.has(tld)){
      skipped.push(domain + ' (pays non détecté, à préciser)');
      return;
    }
    if(!country){ country = tld.toUpperCase(); }

    const key = domain;
    if(!grouped[key]){
      grouped[key] = { domain, countries:[], price: price||3.99, stock: 0 };
    }
    if(!grouped[key].countries.includes(country)){
      grouped[key].countries.push(country);
    }
    grouped[key].stock += stock||10;
    if(price) grouped[key].price = price;
  });

  return { products: Object.values(grouped), skipped };
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ACCESMAIL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080D18;--bg2:#0C1322;--sf:#121A2E;--sf2:#182238;
  --ink:#E2EDF7;--sub:#6C86A8;--muted:#28405C;
  --ac:#1b9fff;--ac2:#68ccff;
  --ok:#3EDB74;--err:#FF5B4D;--errs:rgba(255,79,64,.14);
  --line:rgba(27,159,255,.10);--r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:#040810;overscroll-behavior:none;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
input,button{font-family:'Inter',sans-serif;color:var(--ink);background:transparent;outline:none;border:none;}
input::placeholder{color:var(--sub);}

/* --- SPLASH --- */
#splash{position:fixed;inset:0;z-index:200;background:#040810;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease;}
#splash.out{opacity:0;pointer-events:none;}
.splash-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:3rem;color:#68ccff;text-shadow:0 0 24px rgba(27,159,255,.55);}
.splash-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;color:#2A6070;margin-top:8px;}
.splash-loader{width:140px;height:2px;margin-top:18px;background:rgba(76,145,203,.11);border-radius:99px;overflow:hidden;}
.splash-loader span{display:block;height:100%;background:linear-gradient(90deg,#0d76c2,#3cb9ff);animation:loadBar 1.4s ease-in-out forwards;}
@keyframes loadBar{0%{width:0%}100%{width:100%}}

/* --- APP --- */
.app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:72px;background:#040810;position:relative;z-index:1;}
.screen{display:none;padding:0 0 8px;background:#040810;min-height:100vh;}
.screen.active{display:block;}

/* --- TOPBAR --- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;}
.tb-logo{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;user-select:none;}
.stock-badge{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;}
.stock-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);}

/* --- PROFILE ROW --- */
.profile-row{margin:0 12px 14px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.av{width:44px;height:44px;border-radius:11px;flex:0 0 auto;overflow:hidden;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:1px solid var(--line);}
.pinfo{flex:1;min-width:0;}
.pname{font-weight:700;font-size:14px;}
.puid{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);margin-top:1px;}
.pbal-area{text-align:right;}
.pbal-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--sub);}
.pbal-val{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:17px;color:var(--ac);}

/* --- SEARCH --- */
.search-row{margin:0 12px 12px;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;height:44px;}
.search-row.on{border-color:rgba(27,159,255,.4);box-shadow:0 0 0 3px rgba(27,159,255,.08);}
.s-hash{color:var(--ac);flex:0 0 auto;}
.s-in{flex:1;background:transparent;border:none;font-size:14px;color:var(--ink);}
.s-in::placeholder{color:var(--sub);}
.s-x{background:var(--sf2);border:1px solid var(--line);border-radius:7px;width:26px;height:26px;font-size:11px;cursor:pointer;color:var(--sub);display:none;align-items:center;justify-content:center;flex:0 0 auto;}

/* --- CATALOG --- */
.stock-list{display:flex;flex-direction:column;gap:10px;padding:0 12px;}
.scard{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s;animation:fadeUp .35s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.scard-main{flex:1;min-width:0;}
.scard-dom{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:15px;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.scard-flags{font-size:15px;letter-spacing:2px;}
.scard-right{text-align:right;flex:0 0 auto;}
.scard-price{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:20px;color:var(--ac);margin-bottom:8px;}
.add-btn{width:40px;height:40px;border-radius:50%;background:var(--ac);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:300;color:#111;transition:transform .18s;}
.add-btn:active{transform:scale(.88);}
.add-btn:disabled{background:var(--sf2);color:var(--sub);cursor:default;}
.scard-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.tag{display:inline-flex;padding:3px 9px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;background:var(--sf2);color:var(--sub);border:1px solid var(--line);}
.tag.gold{background:rgba(240,165,0,.12);color:var(--ac);border-color:rgba(240,165,0,.2);}
.tag.green{background:rgba(62,201,92,.1);color:var(--ok);border-color:rgba(62,201,92,.2);}
.tag.red{background:var(--errs);color:var(--err);border-color:rgba(255,79,64,.2);}
.tag.orange{background:rgba(255,140,0,.1);color:orange;border-color:rgba(255,140,0,.2);}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:50px 0;}

/* --- BOTTOM NAV --- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:460px;margin:0 auto;background:#070D18;border-top:1px solid rgba(27,159,255,.12);display:flex;padding:0 0 env(safe-area-inset-bottom);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;cursor:pointer;transition:color .15s;}
.nav-item.on{color:var(--ac);}
.nav-item:not(.on){color:var(--sub);}
.nav-ico{font-size:20px;line-height:1;position:relative;}
.nav-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;}
.nav-badge{position:absolute;top:-4px;right:-8px;background:var(--ac);color:#040810;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;display:none;}

/* --- CART --- */
.cart-wrap{padding:0 12px 8px;}
.cart-item{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;}
.ci-info{flex:1;min-width:0;}
.ci-dom{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ac);margin-bottom:2px;}
.ci-unit{font-size:11px;color:var(--sub);}
.ci-tot{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
.stepper{display:flex;align-items:center;gap:3px;background:var(--bg2);border-radius:999px;padding:3px;}
.stepper button{background:var(--sf);border:none;width:28px;height:28px;border-radius:999px;font-size:15px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.stepper button:active{transform:scale(.82);}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;min-width:22px;text-align:center;}
.sum-box{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:4px 0;}
.sum-tot{color:var(--ink);font-weight:700;font-size:17px;font-family:'Space Grotesk',sans-serif;border-top:1px solid var(--line);margin-top:7px;padding-top:12px;}
.sl-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);margin:14px 0 8px;}

/* --- PAYMENT SHEET (comme ta capture) --- */
.pay-sheet{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);}
.pay-sheet.open{transform:translateX(0);}
.pay-sheet-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;}
.pay-sheet-back{background:var(--sf);border:1px solid var(--line);width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);cursor:pointer;flex:0 0 auto;}
.pay-sheet-back:active{transform:scale(.86);}
.pay-sheet-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;flex:1;}
.pay-sheet-body{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;}

.pay-card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:20px;}
.pay-amount-display{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:28px;color:var(--ac);text-align:center;margin-bottom:4px;}
.pay-amount-hint{font-size:12px;color:var(--sub);text-align:center;margin-bottom:16px;}
.pay-crypto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.pay-crypto-btn{padding:12px 8px;background:var(--sf2);border:2px solid var(--line);border-radius:12px;text-align:center;cursor:pointer;transition:all .15s;color:var(--sub);}
.pay-crypto-btn:active{transform:scale(.95);}
.pay-crypto-btn.on{border-color:var(--ac);background:rgba(27,159,255,.1);color:var(--ink);}
.pay-crypto-btn img{width:28px;height:28px;display:block;margin:0 auto 4px;border-radius:50%;}
.pay-crypto-btn .label{font-size:10px;font-weight:600;}
.pay-crypto-btn .net{font-size:8px;opacity:.5;}
.pay-btn{width:100%;padding:14px;background:var(--ac);color:#111;font-weight:700;font-size:15px;border-radius:12px;cursor:pointer;transition:transform .15s;}
.pay-btn:active{transform:scale(.97);}
.pay-btn:disabled{opacity:.4;cursor:default;}

.pay-qr-box{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.pay-qr-box img{width:160px;height:160px;border-radius:12px;border:2px solid var(--line);}
.pay-addr-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;}
.pay-addr-row span{font-family:'IBM Plex Mono',monospace;font-size:10px;word-break:break-all;flex:1;color:var(--ink);}
.pay-addr-row button{background:var(--sf2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;color:var(--ink);flex:0 0 auto;}
.pay-status{display:flex;align-items:center;gap:10px;padding:6px 0;}
.pay-status-dot{width:10px;height:10px;border-radius:50%;background:var(--sub);flex:0 0 auto;}
.pay-status-dot.wait{animation:dotPulse 1.5s infinite;}
.pay-status-dot.done{background:var(--ok);box-shadow:0 0 10px var(--ok);}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.2}}
.pay-status-txt{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sub);}
.pay-cancel-btn{width:100%;padding:12px;background:transparent;border:1px solid rgba(255,79,64,.25);border-radius:12px;color:var(--err);font-weight:600;font-size:13px;cursor:pointer;}
.pay-cancel-btn:active{background:var(--errs);}

/* --- CART PAGE HEADER --- */
.phdr{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;}
.back-btn{background:var(--sf);border:1px solid var(--line);width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;color:var(--ink);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
.ptitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.4rem;}

/* --- CHECKER --- */
.ct-wrap{padding:20px 16px;max-width:420px;margin:0 auto;}
.ct-card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
.ct-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);display:block;margin-bottom:6px;}
.field{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink);margin-bottom:12px;}
.field:focus{border-color:rgba(27,159,255,.4);}
.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;background:var(--ac);color:#111;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;width:100%;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:default;}
.ct-result-card{border-radius:12px;padding:16px;text-align:center;margin-top:12px;}
.ct-result-valid{background:rgba(62,201,92,.1);border:1px solid rgba(62,201,92,.25);color:var(--ok);}
.ct-result-invalid{background:rgba(255,79,64,.1);border:1px solid rgba(255,79,64,.25);color:var(--err);}
.ct-result-unknown{background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);color:orange;}
.ct-result-icon{font-size:30px;margin-bottom:4px;}
.ct-result-title{font-weight:700;font-size:15px;}
.ct-server-box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:10px;}
.ct-quota-bar{width:100%;height:4px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:8px;}
.ct-quota-fill{height:100%;background:linear-gradient(90deg,#1b9fff,#68ccff);border-radius:99px;transition:width .3s;}
.ct-quota-txt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sub);text-align:center;margin-top:4px;}
.ct-loading{display:flex;align-items:center;gap:12px;padding:12px;background:var(--sf);border-radius:12px;margin-top:12px;}
.ct-loading-ring{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.ct-loading-txt{font-size:13px;color:var(--sub);}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,12px);background:var(--sf2);color:var(--ink);border:1px solid rgba(240,165,0,.15);font-size:13px;font-weight:500;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:88%;text-align:center;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

<div id="splash">
  <div class="splash-logo">ACCESMAIL</div>
  <div class="splash-sub">by @johndosql</div>
  <div class="splash-loader"><span></span></div>
</div>

<div class="app" id="app">

  <!-- SHOP -->
  <div class="screen active" id="S_shop">

      <div class="tb-logo">ACCESMAIL</div>

      <div id="payBlock"></div>

  <!-- CHECKER -->
  <div class="screen" id="S_checktool">

      <button class="back-btn" id="btnCheckBack">←</button>
      <span class="ptitle">Vérifier un accès</span>

      <div class="ct-card">
        <label class="ct-lbl">Email</label>
        <input class="field" id="ctEmail" type="text" placeholder="exemple@domaine.com">
        <label class="ct-lbl">Mot de passe</label>
        <input class="field" id="ctPass" type="text" placeholder="Mot de passe">
        <button class="btn" id="ctBtn">Vérifier</button>
        <div id="ctQuota" style="margin-top:10px;"></div>
        <div id="ctResult"></div>
      </div>
    </div>
  </div>

</div>

<!-- PAYMENT SHEET -->
<div class="pay-sheet" id="paySheet">
  <div class="pay-sheet-hdr">
    <button class="pay-sheet-back" id="paySheetBack">←</button>
    <span class="pay-sheet-title" id="paySheetTitle">Paiement</span>
  </div>
  <div class="pay-sheet-body">
    <div class="pay-card" id="payStepChoix">
      <div class="pay-amount-display" id="payAmountDisplay">0,00€</div>
      <div class="pay-amount-hint">Choisis ta crypto</div>

    <div id="payStepQR" style="display:none;">
      <div class="pay-qr-box">
        <span style="font-size:11px;color:var(--ac);font-family:IBM Plex Mono,monospace;" id="payNetLabel">—</span>
        <img id="payQRImg" src="" alt="QR Code">
        <div class="pay-addr-row">
          <span id="payAddrTxt">—</span>
          <button id="payAddrCopy">Copier</button>
        </div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:22px;color:var(--ac);" id="payAmountTxt">—</div>
        <div class="pay-status">
          <div class="pay-status-dot wait" id="payStatusDot"></div>
          <div class="pay-status-txt" id="payStatusTxt">En attente…</div>
        </div>
      </div>
      <button class="pay-cancel-btn" id="payCancelBtn">✕ Annuler</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottomNav">
  <button class="nav-item on" data-tab="shop" id="navShop">
    <div class="nav-ico">🏪</div>
    <div class="nav-lbl">Shop</div>
  </button>
  <button class="nav-item" data-tab="cart" id="navCart">
    <div class="nav-ico">🛒<span class="nav-badge" id="navBadge"></span></div>
    <div class="nav-lbl">Panier</div>
  </button>
  <button class="nav-item" data-tab="checktool" id="navCheck">
    <div class="nav-ico">🔍</div>
    <div class="nav-lbl">Checker</div>
  </button>
  <button class="nav-item" id="navSolde">
    <div class="nav-ico">💳</div>
    <div class="nav-lbl">Solde</div>
  </button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

  { cur: "usdterc20", label: "USDT", net: "ERC20", logo: "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/usdt.png" },
  { cur: "btc", label: "Bitcoin", net: "BTC", logo: "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/btc.png" },
  { cur: "eth", label: "Ethereum", net: "ETH", logo: "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/eth.png" },
  { cur: "sol", label: "Solana", net: "SOL", logo: "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/sol.png" },
  { cur: "ltc", label: "Litecoin", net: "LTC", logo: "https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/ltc.png" }
];

const CURRENCY = "€";
let db = null, fbAuth = null;
let prods = [], cart = {}, myBal = 0, me = { id: null, name: "Invité", handle: "" };
let activeC = "all", query = "";
let payPoll = null;

// ════════════════════════════════════════
// FIREBASE INIT
// ════════════════════════════════════════

try {
  firebase.initializeApp(FB);
  db = firebase.database();
  fbAuth = firebase.auth();
} catch(e) { console.warn("Firebase:", e); }

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toFixed(2).replace(".", ",") + CURRENCY;

function toast(msg, dur = 3000) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), dur);
}

function haptic(s) {
  try { window.Telegram.WebApp.HapticFeedback.impactOccurred(s || "light"); } catch(e) {}
}

function flag(iso) {
  if (!iso || iso === "all") return "🌍";
  const c = iso.toLowerCase();
  return `<img src="https://flagcdn.com/w40/${c}.png" style="width:16px;height:auto;vertical-align:middle;border-radius:2px">`;
}

function domainAvatar(domain) {
  const d = domain || "?";
  const letter = d.charAt(0).toUpperCase();
  let hash = 0;
  for (let i = 0; i < d.length; i++) hash = d.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  const color = `hsl(${hue},55%,40%)`;
  return `<span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:${color};color:#fff;font-size:9px;font-weight:700;text-align:center;line-height:16px;flex:0 0 auto;">${letter}</span>`;
}

function apiPost(endpoint, body) {
  return fetch(`${BACKEND}/api/${endpoint}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(r => r.json());
}

// ════════════════════════════════════════
// USER & BALANCE
// ════════════════════════════════════════

function initUser() {
  try {
    const tg = window.Telegram?.WebApp;
    const u = tg?.initDataUnsafe?.user;
    if (u && u.id) {
      me.id = "u" + u.id;
      me.name = [u.first_name, u.last_name].filter(Boolean).join(" ") || "Utilisateur";
      me.handle = u.username ? "@" + u.username : "";
    }
  } catch(e) {}
  $("pName").textContent = me.name;
  $("pUid").textContent = me.handle || "ACCESMAIL";
  $("avEl").textContent = me.name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2) || "?";
  if (db && me.id) {
    db.ref("users/" + me.id + "/balance").on("value", s => {
      myBal = parseFloat(s.val() || 0);
      $("pBal").textContent = fmt(myBal);
    });
  }
}

// ════════════════════════════════════════
// PRODUCTS
// ════════════════════════════════════════

function loadProducts() {
  if (!db) return;
  db.ref("products").on("value", s => {
    const v = s.val() || {};
    prods = Object.entries(v).map(([id, p]) => ({ id, ...p }));
    updateStockBadge();
    renderCatalog();
  });
}

function updateStockBadge() {
  const total = prods.reduce((s, p) => s + Number(p.stock || 0), 0);
  const sb = $("stockBadge");
  if (sb) sb.textContent = total + " disponibles";
}

// ════════════════════════════════════════
// CATALOG
// ════════════════════════════════════════

function renderCatalog() {
  const el = $("catalog");
  let items = prods;
  const q = query.trim().toLowerCase();
  if (q) items = items.filter(p => (p.domain || "").toLowerCase().includes(q));
  if (activeC !== "all") items = items.filter(p => (p.countries || []).includes(activeC));
  items = items.sort((a, b) => Number(b.stock || 0) - Number(a.stock || 0));

  if (!items.length) {
    el.innerHTML = '<p class="empty">Aucun accès disponible.</p>';
    return;
  }

  el.innerHTML = items.map(p => {
    const st = Number(p.stock || 0);
    const tags = (p.countries || []).map(c => flag(c) + " " + c).join(" ");
    let tagCls = "gold", tagTxt = st + " en stock";
    if (st <= 0) { tagCls = "red"; tagTxt = "Épuisé"; }
    else if (st <= 5) { tagCls = "orange"; tagTxt = "⚠ " + st + " restants"; }
    return `
      <div class="scard">
        <div class="scard-top">
          <div class="scard-main">
            <div class="scard-dom">${domainAvatar(p.domain)} @${p.domain}</div>
            <div class="scard-flags">${(p.countries || []).map(c => flag(c)).join(" ")}</div>
          </div>
          <div class="scard-right">
            <div class="scard-price">${fmt(4)}</div>
            <button class="add-btn" ${st <= 0 ? "disabled" : ""}>+</button>
          </div>
        </div>
        <div class="scard-tags">
          <span class="tag ${tagCls}">${tagTxt}</span>
          ${(p.countries || []).slice(0,3).map(c => `<span class="tag">${flag(c)} ${c}</span>`).join("")}
        </div>
      </div>
    `;
  }).join("");

  el.querySelectorAll(".add-btn:not([disabled])").forEach((btn, i) => {
    btn.onclick = () => addToCart(items[i]);
  });
}

// ════════════════════════════════════════
// CART
// ════════════════════════════════════════

function addToCart(p) {
  if ((cart[p.id] || 0) >= Number(p.stock || 0)) { toast("Stock max atteint."); return; }
  cart[p.id] = (cart[p.id] || 0) + 1;
  haptic("light");
  updateCartBadge();
  renderCart();
  toast("@" + p.domain + " ajouté ✓");
}

function updateCartBadge() {
  const n = Object.values(cart).reduce((s, v) => s + v, 0);
  const badge = $("navBadge");
  badge.style.display = n ? "block" : "none";
  badge.textContent = n || "";
}

function getCartItems() {
  return Object.entries(cart).map(([id, qty]) => {
    const item = prods.find(p => p.id === id);
    return { item, qty };
  }).filter(e => e.item);
}

function cartTotal() {
  return getCartItems().reduce((s, e) => s + 4 * e.qty, 0);
}

function renderCart() {
  const items = getCartItems();
  const cl = $("cartList");
  if (!items.length) {
    cl.innerHTML = '<p style="text-align:center;color:var(--sub);padding:50px 0;">Panier vide</p>';
    $("sumBlock").innerHTML = "";
    $("payBlock").innerHTML = "";
    return;
  }

  cl.innerHTML = items.map(({ item, qty }) => `
    <div class="cart-item">
      <div class="ci-info">
        <div class="ci-dom">@${item.domain}</div>
        <div class="ci-unit">${fmt(4)}/unité</div>
      </div>
      <div class="stepper">
        <button data-d="-1" data-id="${item.id}">−</button>
        <span>${qty}</span>
        <button data-d="1" data-id="${item.id}">+</button>
      </div>
      <div class="ci-tot">${fmt(4 * qty)}</div>
    </div>
  `).join("");

  cl.querySelectorAll(".stepper button").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const d = parseInt(btn.dataset.d);
      const newQty = (cart[id] || 0) + d;
      if (newQty <= 0) delete cart[id];
      else cart[id] = newQty;
      updateCartBadge();
      renderCart();
    };
  });

  const tot = cartTotal();
  $("sumBlock").innerHTML = `
    <div class="sum-box">
      <div class="sum-row"><span>Articles (${Object.values(cart).reduce((s,v) => s + v, 0)})</span><span>${fmt(tot)}</span></div>
      <div class="sum-row"><span>Mon solde</span><span style="color:var(--ac)">${fmt(myBal)}</span></div>
      <div class="sum-row sum-tot"><span>Total</span><span>${fmt(tot)}</span></div>
    </div>
  `;

  $("payBlock").innerHTML = `
    <button class="btn" id="payOpenBtn" style="margin-top:12px;padding:14px;font-size:14px;">💳 Payer</button>
  `;
  $("payOpenBtn").onclick = () => openPayment(tot);
}

// ════════════════════════════════════════
// PAYMENT (comme ta capture)
// ════════════════════════════════════════

let selectedCrypto = "usdttrc20";
let pendingPaymentId = null;

function openPayment(amount) {
  $("payAmountDisplay").textContent = fmt(amount);
  $("paySheetTitle").textContent = "Paiement " + fmt(amount);
  $("payStepChoix").style.display = "block";
  $("payStepQR").style.display = "none";
  if (payPoll) { clearInterval(payPoll); payPoll = null; }

  const grid = $("payCryptoGrid");
  grid.innerHTML = CRYPTOS.map(c => `
    <div class="pay-crypto-btn ${c.cur === selectedCrypto ? "on" : ""}" data-cur="${c.cur}">
      <img src="${c.logo}" alt="${c.label}">
      <div class="label">${c.label}</div>
      <div class="net">${c.net}</div>
    </div>
  `).join("");

  grid.querySelectorAll(".pay-crypto-btn").forEach(el => {
    el.onclick = () => {
      grid.querySelectorAll(".pay-crypto-btn").forEach(b => b.classList.remove("on"));
      el.classList.add("on");
      selectedCrypto = el.dataset.cur;
      haptic("light");
    };
  });

  $("payGenerateBtn").onclick = async () => {
    const btn = $("payGenerateBtn");
    btn.disabled = true;
    btn.textContent = "⏳ Génération…";
    try {
      const res = await apiPost("create-payment", {
        amount: amount,
        orderId: "acm_" + Date.now(),
        description: getCartItems().map(e => e.qty + "x @" + e.item.domain).join(", "),
        payCurrency: selectedCrypto,
        userId: me.id,
        tgId: me.tgId || null,
        name: me.name,
        handle: me.handle,
        type: "purchase",
        items: getCartItems().map(e => ({ domain: e.item.domain, qty: e.qty }))
      });
      if (!res || !res.pay_address) {
        toast("❌ " + (res?.message || "Erreur paiement"));
        btn.disabled = false;
        btn.textContent = "Générer le paiement";
        return;
      }
      pendingPaymentId = res.payment_id;
      const cr = CRYPTOS.find(c => c.cur === selectedCrypto);
      $("payNetLabel").textContent = (cr ? cr.label : selectedCrypto) + " · " + (cr ? cr.net : "");
      $("payQRImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + encodeURIComponent(res.pay_address);
      $("payAddrTxt").textContent = res.pay_address;
      const sym = selectedCrypto.replace(/trc20|erc20|bsc/g, "").toUpperCase();
      $("payAmountTxt").textContent = res.pay_amount + " " + sym;
      $("payStatusTxt").textContent = "⏳ En attente de paiement…";
      $("payStatusDot").className = "pay-status-dot wait";
      $("payStepChoix").style.display = "none";
      $("payStepQR").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Générer le paiement";
      startPaymentPoll(res.payment_id);
    } catch(e) {
      toast("Erreur: " + e.message);
      btn.disabled = false;
      btn.textContent = "Générer le paiement";
    }
  };

  $("paySheet").classList.add("open");
}

function startPaymentPoll(pid) {
  if (payPoll) clearInterval(payPoll);
  let attempts = 0;
  payPoll = setInterval(async () => {
    attempts++;
    if (attempts > 30) { clearInterval(payPoll); payPoll = null; return; }
    try {
      const res = await fetch(`${BACKEND}/api/check-payment?id=${pid}`).then(r => r.json());
      if (res.payment_status === "confirmed" || res.payment_status === "finished") {
        clearInterval(payPoll);
        payPoll = null;
        $("payStatusTxt").textContent = "✅ Paiement confirmé !";
        $("payStatusDot").className = "pay-status-dot done";
        toast("✅ Paiement confirmé !");
        cart = {};
        updateCartBadge();
        setTimeout(() => closePayment(), 1500);
      } else if (res.payment_status === "waiting") {
        $("payStatusTxt").textContent = "⏳ En attente…";
      } else if (res.payment_status === "confirming") {
        $("payStatusTxt").textContent = "🔄 Détecté sur la blockchain…";
      } else if (res.payment_status === "failed" || res.payment_status === "expired") {
        clearInterval(payPoll);
        payPoll = null;
        $("payStatusTxt").textContent = "❌ " + res.payment_status;
        toast("Paiement " + res.payment_status);
      }
    } catch(e) {}
  }, 5000);
}

function closePayment() {
  $("paySheet").classList.remove("open");
  if (payPoll) { clearInterval(payPoll); payPoll = null; }
}

$("paySheetBack").onclick = closePayment;
$("payCancelBtn").onclick = closePayment;

// ════════════════════════════════════════
// CHECKER
// ════════════════════════════════════════

async function checkAccount() {
  const email = $("ctEmail").value.trim();
  const pass = $("ctPass").value.trim();
  if (!email || !pass) { toast("Remplis tous les champs."); return; }
  const btn = $("ctBtn");
  btn.disabled = true;
  btn.textContent = "⏳ Vérification…";
  $("ctResult").innerHTML = '<div class="ct-loading"><div class="ct-loading-ring"></div><div class="ct-loading-txt">Connexion au serveur…</div></div>';
  try {
    const res = await apiPost("check", { email, password: pass });
    if (res.valid) {
      $("ctResult").innerHTML = `<div class="ct-result-card ct-result-valid"><div class="ct-result-icon">✅</div><div class="ct-result-title">Accès valide</div></div>`;
      toast("✅ Accès valide !");
    } else if (res.error === "skip") {
      $("ctResult").innerHTML = `<div class="ct-result-card ct-result-unknown"><div class="ct-result-icon">ℹ️</div><div class="ct-result-title">Non vérifiable</div></div>`;
    } else {
      $("ctResult").innerHTML = `<div class="ct-result-card ct-result-invalid"><div class="ct-result-icon">❌</div><div class="ct-result-title">Accès invalide</div></div>`;
      toast("❌ Accès invalide");
    }
  } catch(e) {
    $("ctResult").innerHTML = `<div class="ct-result-card ct-result-invalid"><div class="ct-result-icon">⚠️</div><div class="ct-result-title">Erreur</div></div>`;
  }
  btn.disabled = false;
  btn.textContent = "Vérifier";
}

// ════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════

function goTo(page) {
  ["shop", "cart", "checktool"].forEach(p => {
    const el = $("S_" + p);
    if (el) el.classList.toggle("active", p === page);
  });
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("on"));
  const navMap = { shop: "navShop", cart: "navCart", checktool: "navCheck" };
  const nav = $(navMap[page]);
  if (nav) nav.classList.add("on");
  window.scrollTo(0, 0);
  if (page === "cart") renderCart();
}

document.querySelectorAll(".nav-item").forEach(btn => {
  btn.onclick = () => {
    const tab = btn.dataset.tab;
    if (tab === "shop") goTo("shop");
    else if (tab === "cart") goTo("cart");
    else if (tab === "checktool") goTo("checktool");
  };
});

$("btnBack").onclick = () => goTo("shop");
$("btnCheckBack").onclick = () => goTo("shop");

// ════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════

const searchIn = $("searchIn");
const searchClear = $("searchClear");
searchIn.oninput = () => {
  query = searchIn.value.trim();
  searchClear.style.display = query.length ? "flex" : "none";
  renderCatalog();
};
searchClear.onclick = () => {
  searchIn.value = "";
  query = "";
  searchClear.style.display = "none";
  renderCatalog();
};

// ════════════════════════════════════════
// SPLASH
// ════════════════════════════════════════

setTimeout(() => {
  const sp = $("splash");
  sp.classList.add("out");
  setTimeout(() => sp.style.display = "none", 500);
}, 2000);

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════

initUser();
loadProducts();
$("ctBtn").onclick = checkAccount;

// Solde
$("navSolde").onclick = () => toast("Solde : " + fmt(myBal));
$("profileCard").onclick = () => toast("Solde : " + fmt(myBal));

try {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
} catch(e) {}
</script>

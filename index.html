<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACCESMAIL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== THEME ===== */
:root{
  --bg:#000000; --bg2:#08080F; --surface:#0C0E1C; --surface2:#111328;
  --ink:#E3E5F0; --muted:#52566E; --accent:#5B7FFF; --a2:#A855F7;
  --soft:rgba(91,127,255,.13); --line:rgba(255,255,255,.07);
  --ok:#34D399; --err:#FF5D52; --errs:rgba(255,93,82,.12);
  --r:14px; --p-op:1;
  color-scheme:dark;
}
[data-light]{
  --bg:#EDEFF7; --bg2:#E3E6F2; --surface:#FFF; --surface2:#F2F4FC;
  --ink:#0E1020; --muted:#6A7080; --accent:#2952E3; --a2:#7C3AED;
  --soft:rgba(41,82,227,.09); --line:rgba(0,0,0,.07);
  --ok:#059669; --err:#C2372B; --errs:rgba(194,55,43,.1);
  --p-op:.15;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{
  background:#000000 !important;
  min-height:100%;
  overscroll-behavior:none;
}
html[data-light]{background:#EDEFF7 !important;}
body{
  min-height:100vh;
  background:#000000 !important;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overscroll-behavior:none;
  transition:color .4s;
}
html[data-light] body{ background:#EDEFF7 !important; }
input,textarea,button{font-family:'Inter',sans-serif;color:var(--ink);background:transparent;}
input::placeholder,textarea::placeholder{color:var(--muted);}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--bg2) inset;-webkit-text-fill-color:var(--ink);}

/* ===== CANVAS ===== */
#cv{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ===== SCREENS ===== */
.screen{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;padding:16px 18px 130px;}
.screen.off{display:none!important;}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{text-shadow:0 0 30px rgba(91,127,255,.6),0 0 60px rgba(91,127,255,.2)}50%{text-shadow:0 0 50px rgba(168,85,247,.8),0 0 100px rgba(91,127,255,.4)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}

.anim{opacity:0;animation:fadeUp .6s cubic-bezier(.22,1,.36,1) forwards;}
.anim:nth-child(1){animation-delay:.04s}
.anim:nth-child(2){animation-delay:.11s}
.anim:nth-child(3){animation-delay:.18s}
.anim:nth-child(4){animation-delay:.25s}
.anim:nth-child(5){animation-delay:.32s}
.anim:nth-child(6){animation-delay:.39s}

/* ===== TOPBAR ===== */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.tb-space{flex:1;}
.ib{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;}
.ib:active{transform:scale(.91);}

/* ===== PROFILE ===== */
.profile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:18px;position:relative;overflow:hidden;}
.profile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--a2));}
.av{width:48px;height:48px;border-radius:13px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:#fff;overflow:hidden;position:relative;}
.av img{width:100%;height:100%;object-fit:cover;}
.av-ring{position:absolute;inset:-4px;border-radius:17px;border:2px solid var(--accent);animation:pulseRing 2.5s ease-out infinite;}
.pinfo{flex:1;min-width:0;}
.pname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.phandle{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:1px;}
.pbal{text-align:right;}
.pbal-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);}
.pbal-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--ok);}

/* ===== HERO ===== */
.hero{margin-bottom:16px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(2rem,9vw,2.8rem);letter-spacing:-.02em;line-height:1;background:linear-gradient(110deg,var(--accent),var(--a2),var(--accent));background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;animation:glow 4s ease-in-out infinite, shimmer 4s linear infinite;}
.tagline{font-size:14px;line-height:1.55;color:var(--muted);max-width:34ch;}
.price-hint{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;color:var(--muted);}
.price-promo{color:var(--ok);font-weight:600;background:rgba(52,211,153,.1);padding:2px 9px;border-radius:999px;font-size:12px;}

/* ===== SEARCH ===== */
.search-wrap{position:relative;margin-bottom:10px;}
.search-in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 42px;font-size:15px;outline:none;transition:border-color .15s;color:var(--ink);}
.search-in:focus{border-color:var(--accent);}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.search-ct{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:12px;}

/* ===== CAROUSEL ===== */
.sec-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.carousel-wrap{overflow-x:auto;scrollbar-width:none;padding:4px 0 12px;}
.carousel-wrap::-webkit-scrollbar{display:none;}
.carousel{display:flex;gap:8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.ci{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;min-width:68px;max-width:68px;transition:all .15s;}
.ci:active{transform:scale(.93);}
.ci.on{background:var(--soft);border-color:var(--accent);}
.ci-flag{font-size:26px;line-height:1;}
.ci-name{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:60px;}
.ci.on .ci-name{color:var(--accent);font-weight:600;}

/* ===== CATALOG ===== */
.catalog{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;animation:fadeUp .4s ease both;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.c-dom{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:15px;color:var(--accent);}
.stag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--accent);}
.stag.low{background:rgba(255,165,0,.12);color:orange;}
.stag.out{background:var(--errs);color:var(--err);}
.c-ctry{font-size:12px;color:var(--muted);margin-bottom:12px;}
.c-bot{display:flex;justify-content:space-between;align-items:center;}
.c-price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:50px 0;}
.trust{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:28px;}

/* ===== BUTTONS ===== */
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--a2));border:none;padding:10px 18px;border-radius:10px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .2s,box-shadow .2s;}
.btn:active{transform:scale(.93);opacity:.88;}
.btn:not(:disabled):hover{box-shadow:0 4px 20px rgba(91,127,255,.4);}
.btn:disabled{opacity:.3;cursor:default;}
.btn-flat{background:var(--surface2);color:var(--ink);border:1px solid var(--line);}
.btn-danger{background:var(--err)!important;}
.btn-ok{background:var(--ok)!important;}

/* ===== CART BAR ===== */
.cart-bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 50%,transparent);transform:translateY(130%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:20;}
.cart-bar.show{transform:translateY(0);}
.cb-inner{width:100%;max-width:420px;background:linear-gradient(120deg,var(--accent),var(--a2));color:#fff;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 12px 32px rgba(91,127,255,.3);}
.cb-l{font-size:13px;opacity:.85;}
.cb-r{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}

/* ===== MUSIC PLAYER ===== */
.music-bar{position:fixed;left:0;right:0;bottom:76px;display:none;justify-content:center;z-index:19;padding:0 18px;}
.music-bar.show{display:flex;}
.music-inner{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.music-btn{width:32px;height:32px;border-radius:8px;background:var(--soft);border:none;color:var(--accent);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.music-title{font-size:12px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.music-vol{-webkit-appearance:none;width:70px;height:4px;border-radius:2px;background:var(--line);outline:none;flex:0 0 auto;}
.music-vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer;}

/* ===== PAGE HEADER ===== */
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;animation:slideDown .35s ease;}
.back-btn{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:11px;font-size:17px;cursor:pointer;color:var(--ink);flex:0 0 auto;}
.page-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:-.01em;}

/* ===== CART ===== */
.cart-list{display:flex;flex-direction:column;gap:10px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;animation:fadeUp .35s ease;}
.ci-name{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:14px;color:var(--accent);margin-bottom:2px;}
.ci-unit{font-size:12px;color:var(--muted);}
.stepper{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
.stepper button{background:none;border:none;font-size:16px;width:20px;height:20px;color:var(--ink);cursor:pointer;}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:14px;text-align:center;}
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:4px;}
.sum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:5px 0;}
.sum-row.tot{color:var(--ink);font-weight:700;font-size:18px;font-family:'Space Grotesk',sans-serif;border-top:1px solid var(--line);margin-top:8px;padding-top:14px;}

/* ===== PAY ===== */
.pay-tabs{display:flex;gap:8px;margin-bottom:12px;}
.pay-tab{flex:1;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center;transition:all .15s;}
.pay-tab.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
.pay-panel{display:none;}
.pay-panel.on{display:block;}
.pay-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;}
.pay-net{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);background:var(--soft);display:inline-block;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
.pay-addr{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;}
.pay-addr span{font-family:'IBM Plex Mono',monospace;font-size:11px;word-break:break-all;flex:1;color:var(--ink);}
.copy-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink);flex:0 0 auto;}
.pay-note{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.bal-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center;}
.bal-big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2.5rem;color:var(--ok);margin:8px 0 4px;}
.bal-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}

/* ===== ADMIN ===== */
.lock-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 24px;text-align:center;animation:fadeUp .4s ease;}
.lock-ico{font-size:40px;margin-bottom:14px;}
.lock-box p{font-size:13px;color:var(--muted);margin-bottom:16px;}
.field{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--ink);outline:none;margin-bottom:10px;transition:border-color .15s;-webkit-text-fill-color:var(--ink);}
.field:focus{border-color:var(--accent);}
.a-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;}
.a-title{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--accent);margin-bottom:12px;font-weight:500;}
.a-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.a-row label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:56px;flex:0 0 auto;}
.a-row .field{margin-bottom:0;padding:9px 12px;font-size:13px;}
.a-acts{display:flex;gap:8px;margin-top:10px;}
.a-acts .btn{flex:1;padding:9px;font-size:13px;}
.u-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.u-av{width:38px;height:38px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;}
.u-name{font-weight:500;font-size:14px;}
.u-bal{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ok);}
.u-act{margin-left:auto;}
.sm-btn{font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--ink);}
.banner{background:var(--soft);color:var(--accent);font-size:12px;padding:10px 14px;border-radius:10px;margin-bottom:12px;line-height:1.5;border:1px solid rgba(91,127,255,.2);}
.banner.warn{background:var(--errs);color:var(--err);border-color:rgba(255,93,82,.2);}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:130px;transform:translate(-50%,20px);background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-size:13px;font-weight:500;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:85%;text-align:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translate(-50%,0);}

.sl-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<canvas id="cv"></canvas>

<!-- BOUTIQUE -->

</div>

</div>

<div class="music-bar" id="musicBar">

/* ============ PARTICLES ============ */
(function(){
  const cv=$("cv"),cx=cv.getContext("2d");
  const syms=["@","✉","@","@","✉","@","✉","@","@","✉"];
  const cols=["#7B9FFF","#C084FC","#A5B4FC","#E879F9","#60A5FA","#818CF8","#F472B6"];
  let w,h,dots=[];
  const reduced=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function isDark(){return!document.documentElement.hasAttribute("data-light");}
  function resize(){w=cv.width=window.innerWidth;h=cv.height=window.innerHeight;}
  function seed(){
    const n=Math.min(90,Math.floor(w*h/8500));
    dots=Array.from({length:n},()=>({
      sym:syms[Math.floor(Math.random()*syms.length)],
      col:cols[Math.floor(Math.random()*cols.length)],
      x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.55,vy:(Math.random()-.5)*.55,
      sz:20+Math.random()*34,op:.7+Math.random()*.3,
      rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.013
    }));
  }
  function draw(){
    cx.clearRect(0,0,w,h);
    const dark=isDark();
    dots.forEach(d=>{
      if(!reduced){d.x+=d.vx;d.y+=d.vy;if(d.x<-60||d.x>w+60)d.vx*=-1;if(d.y<-60||d.y>h+60)d.vy*=-1;d.rot+=d.rv;}
      cx.save();cx.translate(d.x,d.y);if(!reduced)cx.rotate(d.rot);
      if(dark){cx.shadowColor=d.col;cx.shadowBlur=d.sz*2.8;}
      cx.font="bold "+d.sz+"px 'Space Grotesk',sans-serif";
      cx.fillStyle=d.col;
      cx.globalAlpha=dark?d.op:d.op*.18;
      cx.textAlign="center";cx.textBaseline="middle";
      cx.fillText(d.sym,0,0);
      if(dark){cx.globalAlpha=d.op*.5;cx.fillText(d.sym,0,0);}
      cx.restore();
    });
    if(!reduced)requestAnimationFrame(draw);
  }
  window.addEventListener("resize",()=>{resize();seed();});
  resize();seed();draw();
})();

/* ============ NOWPAYMENTS ============ */
let pollInterval=null;

async function createPayment(amount,orderId,description){
  const res=await fetch(VERCEL_API+"/api/create-payment",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({amount,orderId,description})
  });
  return res.json();
}
async function checkPayment(pid){
  const res=await fetch(VERCEL_API+"/api/check-payment?id="+pid);
  return res.json();
}
async function deliverCreds(orderEntries){
  if(!fbOk)return[];
  const out=[];
  for(const{item,qty}of orderEntries){
    const snap=await db.ref("credentials/"+item.id).orderByChild("sold").equalTo(false).limitToFirst(qty).once("value");
    const cr=snap.val()||{};
    const keys=Object.keys(cr).slice(0,qty);
    for(const k of keys){
      await db.ref("credentials/"+item.id+"/"+k+"/sold").set(true);
      out.push({domain:item.domain,...cr[k]});
    }
    await db.ref("products/"+item.id+"/stock").set(Math.max(0,Number(item.stock||0)-keys.length));
  }
  return out;
}
function stopPoll(){if(pollInterval){clearInterval(pollInterval);pollInterval=null;}}
function startPoll(pid,orderEntries){
  stopPoll();
  const ST={
    waiting:{l:"⏳ En attente de paiement…",p:10},
    confirming:{l:"🔄 Transaction détectée…",p:55},
    confirmed:{l:"✅ Confirmé !",p:100},
    finished:{l:"✅ Finalisé !",p:100},
    failed:{l:"❌ Échoué.",p:0},
    expired:{l:"⌛ Expiré.",p:0}
  };
  pollInterval=setInterval(async()=>{
    try{
      const d=await checkPayment(pid);
      const st=ST[d.payment_status]||{l:d.payment_status,p:20};
      const sel=document.getElementById("npStatus");
      const bar=document.getElementById("npBar");
      if(sel)sel.textContent=st.l;
      if(bar)bar.style.width=st.p+"%";
      if(d.payment_status==="confirmed"||d.payment_status==="finished"){
        stopPoll();haptic("medium");
        const creds=await deliverCreds(orderEntries);
        cart={};renderCartBar();
        const ae=document.getElementById("npActive"),se=document.getElementById("npSuccess");
        if(ae)ae.style.display="none";
        if(se){
          let h=`<div class="pay-card"><div style="text-align:center;margin-bottom:16px">
            <div style="font-size:40px">✅</div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-top:8px">Paiement confirmé</div>
            <div style="font-size:13px;color:var(--muted);margin-top:4px">Tes accès sont livrés</div>
          </div>`;
          if(creds.length){
            let all="";
            h+=`<div style="display:flex;flex-direction:column;gap:8px">`;
            creds.forEach(c=>{
              const line=c.email+(c.pass?":"+c.pass:"");
              all+=line+"\n";
              h+=`<div style="background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px">
                <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);margin-bottom:4px">@${c.domain}</div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;word-break:break-all">${c.email}</div>
                ${c.pass?`<div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);word-break:break-all">${c.pass}</div>`:""}
              </div>`;
            });
            const enc=encodeURIComponent(all.trim());
            h+=`</div><button class="btn" style="width:100%;margin-top:14px;padding:12px"
              onclick="navigator.clipboard.writeText(decodeURIComponent('${enc}')).then(()=>toast('Accès copiés !'))">
              📋 Copier tous les accès</button>`;
          } else {
            h+=`<p style="text-align:center;font-size:13px;color:var(--muted)">Tes accès seront envoyés par le support.</p>`;
          }
          h+=`</div>`;se.innerHTML=h;se.style.display="block";
        }
      }
      if(d.payment_status==="failed"||d.payment_status==="expired"){stopPoll();toast("Paiement "+d.payment_status+". Réessaie.");}
    }catch(e){console.error(e);}
  },10000);
}

function uPrice(item,qty){return qty>=PRICE_THRESHOLD?PRICE_PRO:PRICE_BASE;}
function addCart(p){
  if((cart[p.id]||0)>=Number(p.stock||0)){toast("Stock maximum atteint.");return;}
  cart[p.id]=(cart[p.id]||0)+1;haptic("light");toast("@"+p.domain+" ajouté.");renderCartBar();
}
function chQty(id,d){
  const p=prods.find(x=>x.id===id);
  let n=(cart[id]||0)+d;
  if(n>Number(p?.stock||0))n=Number(p?.stock||0);
  if(n<=0)delete cart[id];else cart[id]=n;
  renderCartBar();renderCartPage();
}

/* ============ MAIL:PASS PARSER ============ */
function parseMailPass(txt){
  const lines=txt.split("\n").map(l=>l.trim()).filter(l=>l&&l.includes("@"));
  const seen=new Set();const grouped={};let dupes=0,invalid=0;
  lines.forEach(line=>{
    const sep=line.indexOf(":");
    const email=(sep>-1?line.slice(0,sep):line).trim().toLowerCase();
    const pass=sep>-1?line.slice(sep+1).trim():"";
    if(!email.includes("@")||!email.includes(".")){invalid++;return;}
    if(seen.has(email)){dupes++;return;}
    seen.add(email);
    const domain=email.split("@")[1];
    const tld=domain.split(".").pop().toLowerCase();
    let country=TMAP[tld]||null;
    if(!country)country=GENERIC_TLD.has(tld)?"MIX":tld.toUpperCase();
    const key=domain+"||"+country;
    if(!grouped[key])grouped[key]={domain,country,accounts:[]};
    grouped[key].accounts.push({email,pass});
  });
  return{groups:Object.values(grouped),dupes,invalid,total:seen.size};
}
function importMailPass(groups){
  const upd={};
  groups.forEach(g=>{
    const ex=prods.find(p=>p.domain===g.domain&&(p.countries||[]).includes(g.country));
    const ref=ex?null:db.ref("products").push();
    const pid=ex?ex.id:ref.key;
    const old=ex?Number(ex.stock||0):0;
    upd["products/"+pid]={domain:g.domain,countries:[g.country],price:PRICE_BASE,stock:old+g.accounts.length};
    g.accounts.forEach(a=>{const r=db.ref("credentials/"+pid).push();upd["credentials/"+pid+"/"+r.key]={email:a.email,pass:a.pass,sold:false};});
  });
  return db.ref("/").update(upd);
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACCESMAIL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--bg2:#08080E;--sf:#0D0F1C;--sf2:#131524;
  --ink:#E4E6F2;--muted:#4A4E68;--ac:#5B7FFF;--a2:#A855F7;
  --soft:rgba(91,127,255,.12);--line:rgba(255,255,255,.07);
  --ok:#34D399;--err:#FF5D52;--errs:rgba(255,93,82,.12);
  --r:14px;--p-op:1;color-scheme:dark;
}
[data-light]{
  --bg:#EDEEF7;--bg2:#E3E5F2;--sf:#FFF;--sf2:#F2F4FC;
  --ink:#0E1020;--muted:#6A7080;--ac:#2952E3;--a2:#7C3AED;
  --soft:rgba(41,82,227,.09);--line:rgba(0,0,0,.07);
  --ok:#059669;--err:#C2372B;--errs:rgba(194,55,43,.1);
  --p-op:.15;color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:#000!important;min-height:100%;overscroll-behavior:none;}
html[data-light]{background:#EDEEF7!important;}
body{min-height:100vh;background:var(--bg)!important;color:var(--ink);
  font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;overscroll-behavior:none;transition:color .3s;}
input,textarea,button{font-family:'Inter',sans-serif;color:var(--ink);background:transparent;}
input::placeholder,textarea::placeholder{color:var(--muted);}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px var(--bg2) inset;-webkit-text-fill-color:var(--ink);}

#cv{position:fixed;inset:0;z-index:0;pointer-events:none;}

.screen{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;padding:14px 14px 120px;}
.screen.off{display:none!important;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{text-shadow:0 0 30px rgba(91,127,255,.5)}50%{text-shadow:0 0 50px rgba(168,85,247,.7),0 0 90px rgba(91,127,255,.3)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes pop{0%{transform:scale(.85);opacity:0}65%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.65);opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.18)}70%{transform:scale(.95)}}

.a1{opacity:0;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .04s forwards}
.a2{opacity:0;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .1s forwards}
.a3{opacity:0;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .16s forwards}
.a4{opacity:0;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .22s forwards}
.a5{opacity:0;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) .28s forwards}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.tb-space{flex:1;}
.ib{width:38px;height:38px;border-radius:11px;background:var(--sf);border:1px solid var(--line);
  color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.ib:active{transform:scale(.85);}

/* PROFILE */
.profile{display:flex;align-items:center;gap:11px;background:var(--sf);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 13px;margin-bottom:14px;position:relative;overflow:hidden;}
.profile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--ac),var(--a2));}
.av{width:44px;height:44px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--ac),var(--a2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;
  overflow:hidden;position:relative;}
.av img{width:100%;height:100%;object-fit:cover;}
.av-ring{position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--ac);animation:ringPulse 2.8s ease-out infinite;}
.pname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.phandle{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:1px;}
.pbal-lbl{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.pbal-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--ok);}

/* HERO */
.hero{margin-bottom:12px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(1.9rem,8vw,2.6rem);letter-spacing:-.02em;line-height:1;
  background:linear-gradient(110deg,var(--ac),var(--a2),var(--ac));background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;animation:glow 4s ease-in-out infinite,shimmer 4s linear infinite;}
.price-hint{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);}
.promo{color:var(--ok);font-weight:600;background:rgba(52,211,153,.1);padding:2px 9px;border-radius:999px;font-size:11px;}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:10px;}
.search-in{width:100%;background:var(--sf);border:1.5px solid var(--line);border-radius:13px;
  padding:12px 14px 12px 42px;font-size:15px;outline:none;color:var(--ink);
  transition:border-color .2s,box-shadow .2s;}
.search-in:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,127,255,.1);}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}

/* CAROUSEL */
.sec-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.cw{overflow-x:auto;scrollbar-width:none;padding:3px 0 10px;}
.cw::-webkit-scrollbar{display:none;}
.carousel{display:flex;gap:7px;scroll-snap-type:x mandatory;}
.ci{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--sf);border:1.5px solid var(--line);border-radius:13px;padding:9px 7px;
  cursor:pointer;min-width:66px;max-width:66px;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.ci:active{transform:scale(.87);}
.ci.on{background:var(--soft);border-color:var(--ac);}
.ci-flag{font-size:24px;line-height:1;}
.ci-name{font-size:9px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:58px;}
.ci.on .ci-name{color:var(--ac);font-weight:600;}

/* CATALOG GRID */
.catalog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.catalog-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.see-all{font-size:12px;font-weight:600;color:var(--ac);cursor:pointer;padding:4px 0;}

.catalog{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

.card{background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 12px;
  animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;position:relative;
  transition:border-color .2s,transform .15s;}
.card:active{transform:scale(.97);}
.card-dom{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;color:var(--ac);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px;}
.card-flags{font-size:13px;margin-bottom:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;
  padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--ac);margin-bottom:8px;}
.stag.low{background:rgba(255,165,0,.12);color:orange;}
.stag.out{background:var(--errs);color:var(--err);}
.card-bot{display:flex;justify-content:space-between;align-items:center;}
.c-price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;}

.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:#fff;
  background:linear-gradient(120deg,var(--ac),var(--a2));border:none;
  padding:8px 14px;border-radius:10px;cursor:pointer;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .15s,box-shadow .2s;}
.btn:active{transform:scale(.88);}
.btn:not(:disabled):hover{box-shadow:0 4px 18px rgba(91,127,255,.32);}
.btn:disabled{opacity:.3;cursor:default;}
.btn-flat{background:var(--sf2);color:var(--ink);border:1.5px solid var(--line);}
.btn-flat:hover{box-shadow:none;}
.btn-danger{background:var(--err)!important;}

.btn-add{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;border-radius:10px;flex:0 0 auto;}
.btn-add.added{animation:bounce .35s cubic-bezier(.34,1.56,.64,1);}

.see-more-btn{grid-column:1/-1;background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);
  padding:13px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);
  transition:all .2s;width:100%;}
.see-more-btn:active{transform:scale(.97);color:var(--ac);}

.empty{text-align:center;color:var(--muted);font-size:14px;padding:50px 0;grid-column:1/-1;}
.trust{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:24px;grid-column:1/-1;}

/* CART BAR */
.cart-bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 55%,transparent);
  transform:translateY(130%);transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:20;}
.cart-bar.show{transform:translateY(0);}
.cb-inner{width:100%;max-width:428px;background:linear-gradient(120deg,var(--ac),var(--a2));color:#fff;
  border-radius:15px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;box-shadow:0 8px 30px rgba(91,127,255,.35);transition:transform .15s;}
.cb-inner:active{transform:scale(.97);}
.cb-l{font-size:13px;opacity:.85;}
.cb-r{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}

/* PAGE HEADER */
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;animation:slideUp .35s cubic-bezier(.22,1,.36,1);}
.back-btn{background:var(--sf);border:1.5px solid var(--line);width:40px;height:40px;border-radius:12px;
  font-size:17px;cursor:pointer;color:var(--ink);flex:0 0 auto;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .2s;}
.back-btn:active{transform:scale(.82);background:var(--soft);}
.page-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.55rem;letter-spacing:-.01em;}

/* CART */
.cart-list{display:flex;flex-direction:column;gap:9px;}
.cart-item{display:flex;align-items:center;gap:10px;background:var(--sf);border:1.5px solid var(--line);
  border-radius:14px;padding:13px 14px;animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
.ci-info{flex:1;min-width:0;}
.ci-name{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ac);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-unit{font-size:11px;color:var(--muted);}
.ci-total{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;}
.stepper{display:flex;align-items:center;gap:3px;background:var(--bg2);border-radius:999px;padding:3px;}
.stepper button{background:var(--sf);border:none;width:28px;height:28px;border-radius:999px;
  font-size:15px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);}
.stepper button:active{transform:scale(.82);}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;min-width:20px;text-align:center;}

.sum-card{background:var(--sf);border:1.5px solid var(--line);border-radius:14px;padding:15px;margin-top:6px;}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;}
.sum-row.tot{color:var(--ink);font-weight:700;font-size:18px;font-family:'Space Grotesk',sans-serif;
  border-top:1px solid var(--line);margin-top:8px;padding-top:13px;}

.sl-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 9px;}

/* PAY */
.pay-tabs{display:flex;gap:6px;margin-bottom:11px;}
.pay-tab{flex:1;padding:10px;background:var(--sf);border:1.5px solid var(--line);border-radius:11px;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.pay-tab:active{transform:scale(.93);}
.pay-tab.on{background:var(--soft);border-color:var(--ac);color:var(--ac);}
.pay-panel{display:none;}
.pay-panel.on{display:block;animation:fadeUp .25s ease;}

/* CRYPTO GRID */
.crypto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px;}
.csel{padding:10px 5px;background:var(--sf);border:1.5px solid var(--line);border-radius:12px;
  font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;line-height:1.4;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.csel:active{transform:scale(.88);}
.csel.on{background:var(--soft);border-color:var(--ac);color:var(--ac);}
.csel-logo{width:28px;height:28px;border-radius:50%;display:block;margin:0 auto 4px;object-fit:contain;}

.pay-card{background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;}
.pay-net{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ac);background:var(--soft);
  display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:12px;}
.pay-addr{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:11px;}
.pay-addr span{font-family:'IBM Plex Mono',monospace;font-size:10px;word-break:break-all;flex:1;color:var(--ink);}
.copy-btn{background:var(--sf2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  font-size:11px;font-weight:600;cursor:pointer;color:var(--ink);flex:0 0 auto;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);}
.copy-btn:active{transform:scale(.88);}
.pay-status{text-align:center;font-size:13px;color:var(--muted);padding:9px 0;}
.pay-prog-wrap{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px;}
.pay-prog{height:100%;background:linear-gradient(90deg,var(--ac),var(--a2));transition:width 2s ease;border-radius:2px;}
.bal-box{background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;text-align:center;}
.bal-big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2.4rem;color:var(--ok);margin:8px 0 4px;}
.bal-sub{font-size:13px;color:var(--muted);margin-bottom:16px;}

/* SUCCESS */
.success-box{background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
.cred-item{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:8px;}
.cred-domain{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ac);margin-bottom:5px;}
.cred-val{font-family:'IBM Plex Mono',monospace;font-size:12px;word-break:break-all;line-height:1.6;}

/* ADMIN */
.lock-box{background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;animation:fadeUp .4s ease;}
.lock-ico{font-size:38px;margin-bottom:12px;}
.lock-box p{font-size:13px;color:var(--muted);margin-bottom:14px;}
.field{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:14px;color:var(--ink);outline:none;margin-bottom:10px;
  transition:border-color .2s,box-shadow .2s;-webkit-text-fill-color:var(--ink);}
.field:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,127,255,.1);}
.a-card{background:var(--sf);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;}
.a-title{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ac);margin-bottom:11px;font-weight:500;}
.a-row{display:flex;gap:7px;margin-bottom:7px;align-items:center;}
.a-row label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);width:52px;flex:0 0 auto;}
.a-row .field{margin-bottom:0;padding:8px 11px;font-size:13px;}
.a-acts{display:flex;gap:7px;margin-top:9px;}
.a-acts .btn{flex:1;padding:9px;font-size:12px;}
.u-row{display:flex;align-items:center;gap:11px;background:var(--sf);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;}
.u-av{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,var(--ac),var(--a2));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#fff;}
.u-name{font-weight:500;font-size:13px;}
.u-bal{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ok);}
.u-act{margin-left:auto;}
.sm-btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--sf2);cursor:pointer;color:var(--ink);transition:transform .15s cubic-bezier(.34,1.56,.64,1);}
.sm-btn:active{transform:scale(.88);}
.banner{background:var(--soft);color:var(--ac);font-size:12px;padding:10px 13px;border-radius:11px;margin-bottom:12px;line-height:1.5;border:1px solid rgba(91,127,255,.2);}
.banner.warn{background:var(--errs);color:var(--err);border-color:rgba(255,93,82,.2);}
.atab{flex:1;padding:9px 4px;font-size:12px;font-weight:600;border-radius:10px;background:var(--sf);border:1.5px solid var(--line);color:var(--muted);cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);text-align:center;}
.atab:active{transform:scale(.91);}
.atab.on{background:var(--soft);border-color:var(--ac);color:var(--ac);}

.toast{position:fixed;left:50%;bottom:115px;transform:translate(-50%,20px);
  background:var(--sf2);color:var(--ink);border:1.5px solid var(--line);
  font-size:13px;font-weight:500;padding:11px 18px;border-radius:13px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s cubic-bezier(.34,1.56,.64,1);
  max-width:85%;text-align:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translate(-50%,0);}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- BOUTIQUE -->
<div class="screen" id="S_shop">
  <div class="topbar a1">
    <button class="ib" id="btnTheme">◐</button>
    <div class="tb-space"></div>
    <button class="ib" id="btnAdmin">⚙</button>
  </div>
  <div class="profile a2">
    <div class="av" id="avEl"><div class="av-ring"></div>?</div>
    <div style="flex:1;min-width:0">
      <div class="pname" id="pName">Chargement…</div>
      <div class="phandle" id="pHandle">ACCESMAIL</div>
    </div>
    <div style="text-align:right">
      <div class="pbal-lbl">Solde</div>
      <div class="pbal-val" id="pBal">0,00 €</div>
    </div>
  </div>
  <header class="hero a3">
    <p class="eyebrow">Boutique digitale</p>

/* PARTICLES */
(function(){
  const cv=$("cv"),cx=cv.getContext("2d");
  const syms=["@","✉","@","@","✉","@"];
  const cols=["#7B9FFF","#C084FC","#A5B4FC","#E879F9","#60A5FA","#818CF8"];
  let w,h,dots=[];
  const red=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  function isDark(){return!document.documentElement.hasAttribute("data-light");}
  function op(){return isDark()?1:.15;}
  function resize(){w=cv.width=window.innerWidth;h=cv.height=window.innerHeight;}
  function seed(){
    const n=Math.min(75,Math.floor(w*h/9500));
    dots=Array.from({length:n},()=>({
      sym:syms[Math.floor(Math.random()*syms.length)],col:cols[Math.floor(Math.random()*cols.length)],
      x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,
      sz:16+Math.random()*32,opacity:.65+Math.random()*.35,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.012
    }));
  }
  function draw(){
    cx.clearRect(0,0,w,h);const dark=isDark(),baseOp=op();
    dots.forEach(d=>{
      if(!red){d.x+=d.vx;d.y+=d.vy;if(d.x<-60||d.x>w+60)d.vx*=-1;if(d.y<-60||d.y>h+60)d.vy*=-1;d.rot+=d.rv;}
      cx.save();cx.translate(d.x,d.y);if(!red)cx.rotate(d.rot);
      if(dark){cx.shadowColor=d.col;cx.shadowBlur=d.sz*2.6;}
      cx.font="bold "+d.sz+"px 'Space Grotesk',sans-serif";
      cx.fillStyle=d.col;cx.globalAlpha=baseOp*d.opacity;
      cx.textAlign="center";cx.textBaseline="middle";
      cx.fillText(d.sym,0,0);
      if(dark){cx.globalAlpha=baseOp*d.opacity*.4;cx.fillText(d.sym,0,0);}
      cx.restore();
    });
    if(!red)requestAnimationFrame(draw);
  }
  window.addEventListener("resize",()=>{resize();seed();});
  resize();seed();draw();
})();

function filtered(){
  const q=query.trim().toLowerCase();
  return prods.filter(p=>
    (q===""||p.domain.toLowerCase().includes(q))&&
    (activeC==="all"||(p.countries||[]).includes(activeC))
  );
}

function renderCatalog(){
  const all=filtered(),el=$("catalog"),sab=$("seeAllBtn"),ct=$("searchCt");
  const isFiltered=activeC!=="all"||query.trim()!=="";
  const items=(!isFiltered&&!showAll)?all.slice(0,GRID_LIMIT):all;
  const hasMore=!isFiltered&&all.length>GRID_LIMIT&&!showAll;

  ct.textContent=all.length+(all.length>1?" acces trouvés":" acces trouvé");
  if(sab){sab.style.display=hasMore?"block":"none";sab.textContent="Voir les "+(all.length-GRID_LIMIT)+" autres →";}

  el.innerHTML="";
  if(!items.length){el.innerHTML='<p class="empty">Aucun acces ne correspond.</p>';return;}

  items.forEach((p,i)=>{
    const st=Number(p.stock||0);
    let sc="",sl=st+" stock";
    if(st<=0){sc="out";sl="Épuisé";}else if(st<=5){sc="low";sl="⚠ "+st+" restants";}
    const flags=(p.countries||[]).map(c=>flag(c)).join(" ");
    const card=document.createElement("div");
    card.className="card";
    card.style.animationDelay=(i*.04)+"s";
    card.innerHTML=`
      <div class="card-dom">@${p.domain}</div>
      <div class="card-flags">${flags}</div>
      <span class="stag ${sc}">${sl}</span>
      <div class="card-bot">
        <div class="c-price">${fmt(PRICE_BASE)}</div>
        <button class="btn btn-add" ${st<=0?"disabled":""} data-id="${p.id}">${st<=0?"✕":"+"}</button>
      </div>`;
    const btn=card.querySelector(".btn-add");
    btn.onclick=()=>{
      if(addCart(p)){btn.classList.remove("added");void btn.offsetWidth;btn.classList.add("added");}
    };
    el.appendChild(card);
  });

  if(hasMore){
    const more=document.createElement("button");
    more.className="see-more-btn";
    more.textContent="Voir les "+(all.length-GRID_LIMIT)+" autres accès →";
    more.onclick=()=>{showAll=true;renderCatalog();};
    el.appendChild(more);
  }

  const trust=document.createElement("div");
  trust.className="trust";
  trust.innerHTML='<span>Crypto sécurisé</span><span>·</span><span>Livraison instantanée</span><span>·</span><span>Stock temps réel</span>';
  el.appendChild(trust);
}

/* CART */
function uPrice(item,qty){return qty>=PRICE_THRESHOLD?PRICE_PRO:PRICE_BASE;}
function addCart(p){
  if((cart[p.id]||0)>=Number(p.stock||0)){toast("Stock max atteint.");return false;}
  cart[p.id]=(cart[p.id]||0)+1;haptic("light");toast("@"+p.domain+" ajouté ✓");renderCartBar();return true;
}
function chQty(id,d){
  const p=prods.find(x=>x.id===id);let n=(cart[id]||0)+d;
  if(n>Number(p?.stock||0))n=Number(p?.stock||0);
  if(n<=0)delete cart[id];else cart[id]=n;
  renderCartBar();renderCartPage();
}
function entries(){return Object.entries(cart).map(([id,qty])=>({item:prods.find(p=>p.id===id),qty})).filter(e=>e.item);}
function cartTotal(){return entries().reduce((s,e)=>s+uPrice(e.item,e.qty)*e.qty,0);}
function cartCount(){return entries().reduce((s,e)=>s+e.qty,0);}
function renderCartBar(){
  const n=cartCount();
  if(!n){$("cartBar").classList.remove("show");return;}
  $("cartBar").classList.add("show");
  $("cbCount").textContent=n+(n>1?" articles":" article");
  $("cbTotal").textContent=fmt(cartTotal())+" →";
}

function renderCartPage(){
  const es=entries();
  $("cartList").innerHTML="";
  if(!es.length){
    $("cartList").innerHTML='<p style="text-align:center;color:var(--muted);padding:60px 0;font-size:14px">🛒 Panier vide</p>';
    $("sumBlock").innerHTML="";$("payBlock").innerHTML="";return;
  }
  es.forEach(({item,qty})=>{
    const row=document.createElement("div");row.className="cart-item";
    const up=uPrice(item,qty),disc=qty>=PRICE_THRESHOLD;
    row.innerHTML=`
      <div class="ci-info">
        <div class="ci-name">@${item.domain}</div>
        <div class="ci-unit">${fmt(up)}/unité${disc?' <span style="color:var(--ok);font-size:10px">✓ prix pro</span>':''}</div>

/* NOWPAYMENTS */
async function createPayment(amount,orderId,description,payCurrency){
  const res=await fetch(VERCEL_API+"/api/create-payment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount,orderId,description,payCurrency:payCurrency||"usdttrc20"})});
  return res.json();
}
async function checkPayment(pid){const res=await fetch(VERCEL_API+"/api/check-payment?id="+pid);return res.json();}

async function deliverCreds(orderEntries){
  if(!fbOk)return[];const out=[];
  for(const{item,qty}of orderEntries){
    const snap=await db.ref("credentials/"+item.id).orderByChild("sold").equalTo(false).limitToFirst(qty).once("value");
    const cr=snap.val()||{};const keys=Object.keys(cr).slice(0,qty);
    for(const k of keys){await db.ref("credentials/"+item.id+"/"+k).remove();out.push({domain:item.domain,email:cr[k].email,pass:cr[k].pass});}
    await db.ref("products/"+item.id+"/stock").set(Math.max(0,Number(item.stock||0)-keys.length));
  }
  return out;
}

async function sendBotMessage(chatId,creds,total){
  if(!chatId)return;
  const defaultMsg=`✅ <b>ACCESMAIL — Commande confirmée</b>\n\nBonjour <b>{prenom}</b> ({handle})\n\n<pre>{acces}</pre>\nTotal : <b>{total}</b>\n\nPour toute question, réponds à ce message.`;
  let template=defaultMsg;
  try{
    const snap=await db.ref("settings/botMessage").once("value");
    if(snap.val())template=snap.val();
  }catch(e){}
  let acces="";
  creds.forEach(c=>{acces+=`${c.email}${c.pass?":"+c.pass:""}\n`;});
  acces=acces.trim();
  const msg=template
    .replace(/\{prenom\}/g,me.name.split(" ")[0])
    .replace(/\{handle\}/g,me.handle||"")
    .replace(/\{acces\}/g,acces)
    .replace(/\{total\}/g,fmt(total));
  try{await fetch(VERCEL_API+"/api/send-message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chatId,text:msg})});}catch(e){console.error(e);}
}

function stopPoll(){if(pollInterval){clearInterval(pollInterval);pollInterval=null;}}
function startPoll(pid,orderEntries){
  stopPoll();
  const ST={waiting:{l:"⏳ En attente de paiement…",p:8},confirming:{l:"🔄 Transaction détectée…",p:55},confirmed:{l:"✅ Confirmé !",p:100},finished:{l:"✅ Finalisé !",p:100},failed:{l:"❌ Échoué.",p:0},expired:{l:"⌛ Expiré.",p:0}};
  pollInterval=setInterval(async()=>{
    try{
      const d=await checkPayment(pid);
      const st=ST[d.payment_status]||{l:d.payment_status,p:20};
      const sel=$("npStatus"),bar=$("npBar");
      if(sel)sel.textContent=st.l;if(bar)bar.style.width=st.p+"%";
      if(d.payment_status==="confirmed"||d.payment_status==="finished"){
        stopPoll();hapticN("success");
        const se=[...orderEntries],stot=se.reduce((s,e)=>s+uPrice(e.item,e.qty)*e.qty,0);
        const creds=await deliverCreds(se);
        if(me.tgId)sendBotMessage(me.tgId,creds,stot);
        cart={};renderCartBar();
        const ae=$("npActive"),seEl=$("npSuccess");
        if(ae)ae.style.display="none";
        if(seEl){
          let h=`<div class="success-box"><div style="text-align:center;margin-bottom:16px"><div style="font-size:44px">✅</div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin-top:8px">Paiement confirmé !</div>
            <div style="font-size:13px;color:var(--muted);margin-top:4px">Tes accès arrivent dans le bot 🤖</div></div>`;
          if(creds.length){
            let all="";
            h+=`<div style="display:flex;flex-direction:column;gap:8px">`;
            creds.forEach(c=>{const line=c.email+(c.pass?":"+c.pass:"");all+=line+"\n";
              h+=`<div class="cred-item"><div class="cred-domain">@${c.domain}</div><div class="cred-val">${c.email}${c.pass?"<br>"+c.pass:""}</div></div>`;});
            const enc=encodeURIComponent(all.trim());
            h+=`</div><button class="btn" style="width:100%;margin-top:13px;padding:11px" onclick="navigator.clipboard.writeText(decodeURIComponent('${enc}')).then(()=>toast('Copié ✓'))">📋 Copier les accès</button>`;
          }else{h+=`<p style="text-align:center;font-size:13px;color:var(--muted)">Tes accès seront envoyés par le support.</p>`;}
          h+=`</div>`;seEl.innerHTML=h;seEl.style.display="block";
        }
      }
      if(d.payment_status==="failed"||d.payment_status==="expired"){stopPoll();toast("Paiement "+d.payment_status+". Réessaie.");}
    }catch(e){console.error(e);}
  },10000);
}

/* MAIL:PASS */
function parseMailPass(txt){
  const lines=txt.split("\n").map(l=>l.trim()).filter(l=>l&&l.includes("@"));
  const seen=new Set();const grouped={};let dupes=0,invalid=0;
  lines.forEach(line=>{
    const sep=line.indexOf(":");
    const email=(sep>-1?line.slice(0,sep):line).trim().toLowerCase();
    const pass=sep>-1?line.slice(sep+1).trim():"";
    if(!email.includes("@")||!email.includes(".")){invalid++;return;}
    if(seen.has(email)){dupes++;return;}
    seen.add(email);
    const domain=email.split("@")[1],tld=domain.split(".").pop().toLowerCase();
    let country=TMAP[tld]||null;
    if(!country)country=GENERIC.has(tld)?"MIX":tld.toUpperCase();
    const key=domain+"||"+country;
    if(!grouped[key])grouped[key]={domain,country,accounts:[]};
    grouped[key].accounts.push({email,pass});
  });
  return{groups:Object.values(grouped),dupes,invalid,total:seen.size};
}
function importMailPass(groups){
  const upd={};
  groups.forEach(g=>{
    const ex=prods.find(p=>p.domain===g.domain&&(p.countries||[]).includes(g.country));
    const ref=ex?null:db.ref("products").push();const pid=ex?ex.id:ref.key;
    const old=ex?Number(ex.stock||0):0;
    upd["products/"+pid]={domain:g.domain,countries:[g.country],price:PRICE_BASE,stock:old+g.accounts.length};
    g.accounts.forEach(a=>{const r=db.ref("credentials/"+pid).push();upd["credentials/"+pid+"/"+r.key]={email:a.email,pass:a.pass,sold:false};});
  });
  return db.ref("/").update(upd);
}

      else ua.forEach(([uid,u])=>{
        const ini=(u.name||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
        const row=document.createElement("div");row.className="u-row";
        row.innerHTML=`<div class="u-av">${ini}</div>
          <div><div class="u-name">${u.name||"Inconnu"}</div><div class="u-bal">${fmt(u.balance||0)}</div></div>
          <div class="u-act"><button class="sm-btn" data-uid="${uid}">+ Solde</button></div>`;
        row.querySelector(".sm-btn").onclick=()=>{
          const amt=parseFloat(prompt("Montant à créditer (€) :"));
          if(isNaN(amt)||amt<=0){toast("Montant invalide.");return;}
          db.ref("users/"+uid+"/balance").set(parseFloat(((u.balance||0)+amt).toFixed(2))).then(()=>toast(fmt(amt)+" crédités à "+u.name+" ✓"));
        };
        au.appendChild(row);
      });
    }
    else if(t==="bot"){
      pane.innerHTML=`
        <div class="a-card">
          <p class="a-title">📱 Message de livraison</p>
          <p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7">
            Personnalise le message envoyé dans le bot après chaque achat.<br>
            Utilise ces balises :<br>
            <code style="background:var(--bg2);padding:1px 5px;border-radius:4px">{prenom}</code> — prénom du client<br>
            <code style="background:var(--bg2);padding:1px 5px;border-radius:4px">{acces}</code> — credentials (généré auto)<br>
            <code style="background:var(--bg2);padding:1px 5px;border-radius:4px">{total}</code> — montant payé
          </p>
          <textarea class="field" id="botMsgField" rows="10"
            style="font-size:13px;line-height:1.7;resize:vertical"
            placeholder="Chargement…"></textarea>
          <button class="btn" id="saveMsgBtn" style="width:100%;margin-top:4px">💾 Enregistrer le message</button>
          <div id="msgSaved" style="font-size:12px;color:var(--ok);text-align:center;margin-top:8px;display:none">✓ Message enregistré</div>
        </div>
        <div class="a-card" style="margin-top:0">
          <p class="a-title">Aperçu du message</p>
          <div id="msgPreview" style="font-size:12px;color:var(--muted);line-height:1.8;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;background:var(--bg2);padding:12px;border-radius:10px"></div>
        </div>`;
      const defaultMsg=`✅ <b>ACCESMAIL — Commande confirmée</b>\n\nBonjour <b>{prenom}</b> ({handle})\n\n<pre>{acces}</pre>\nTotal : <b>{total}</b>\n\nPour toute question, réponds à ce message.`;
      const field=$("botMsgField"),preview=$("msgPreview");
      function updatePreview(){
        preview.textContent=field.value
          .replace("{prenom}","John")
          .replace("{handle}","@johndosql")
          .replace("{acces}","user1@hotmail.com:pass123\nuser2@hotmail.com:pass456")
          .replace("{total}","8,00€");
      }
      db.ref("settings/botMessage").once("value",s=>{
        field.value=s.val()||defaultMsg;updatePreview();
      });
      field.addEventListener("input",updatePreview);
      $("saveMsgBtn").onclick=()=>{
        db.ref("settings/botMessage").set(field.value).then(()=>{
          const saved=$("msgSaved");saved.style.display="block";
          setTimeout(()=>{saved.style.display="none";},2500);
          toast("Message enregistré ✓");
        });
      };

      // BROADCAST - uniquement les vrais utilisateurs Telegram
      const tgIds=Object.entries(users).filter(([uid,u])=>uid.startsWith("u")&&u.tgId&&u.name!=="Invité").map(([,u])=>u.tgId);
      const broadcastSection=document.createElement("div");
      broadcastSection.className="a-card";
      broadcastSection.style.marginTop="0";
      broadcastSection.innerHTML=`
        <p class="a-title">📢 Annonce / Restock</p>
        <p style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6">
          Envoie un message à tous tes clients en même temps.<br>
          <b>${tgIds.length} client${tgIds.length>1?"s":""}</b> enregistré${tgIds.length>1?"s":""}. Supporte le format HTML Telegram.
        </p>
        <textarea class="field" id="broadcastField" rows="6"
          style="font-size:13px;line-height:1.7;resize:vertical"
          placeholder="🔥 <b>RESTOCK DISPONIBLE !</b>\n\nDe nouveaux accès sont disponibles sur ACCESMAIL.\n\nDépêche-toi, le stock est limité ! 👇"></textarea>
        <button class="btn" id="broadcastBtn" style="width:100%;margin-top:8px;padding:13px" ${tgIds.length===0?"disabled":""}>
          📢 Envoyer à ${tgIds.length} client${tgIds.length>1?"s":""}
        </button>
        <div id="broadcastResult" style="margin-top:10px;font-size:12px;text-align:center;color:var(--muted)"></div>
      `;
      pane.appendChild(broadcastSection);

      $("broadcastBtn").onclick=async()=>{
        const msg=$("broadcastField").value.trim();
        if(!msg){toast("Écris un message d'abord.");return;}
        if(!confirm("Envoyer ce message à "+tgIds.length+" client(s) ?"))return;
        const btn=$("broadcastBtn"),res=$("broadcastResult");
        btn.disabled=true;btn.textContent="📤 Envoi en cours…";
        res.textContent="";
        try{
          const data=await fetch(VERCEL_API+"/api/broadcast",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chatIds:tgIds,text:msg})
          }).then(r=>r.json());
          res.innerHTML=`<span style="color:var(--ok)">✅ ${data.sent} envoyé${data.sent>1?"s":""}</span>${data.failed?` · <span style="color:var(--err)">❌ ${data.failed} échoué${data.failed>1?"s":""}</span>`:""}`;
          toast("Broadcast envoyé à "+data.sent+" client(s) ✓");
        }catch(e){
          res.textContent="Erreur : "+e.message;toast("Erreur broadcast.");
        }
        btn.disabled=false;btn.textContent="📢 Envoyer à "+tgIds.length+" client"+(tgIds.length>1?"s":"");
      };
    }
  }
  el.querySelectorAll(".atab").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
  showTab("stock");
}

/* INIT */
initMe();loadProds();renderCartBar();
try{
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();tg.expand();tg.setBackgroundColor("#000000");tg.setHeaderColor("#000000");tg.setBottomBarColor("#000000");}
}catch(e){}
</script>
</body>
</html>

<script>
  // Applique le thème avant l'affichage pour éviter un flash
  (function(){
    var saved = null;
    try{ saved = window.__theme; }catch(e){}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  })();
</script>

<style>
  html[data-theme="light"]{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --ink:#10131F;
    --muted:#5B6072;
    --accent:#2952E3;
    --accent-soft:#EDF0FE;
    --line:#E3E5EA;
    --particle:rgba(41,82,227,0.28);
    --danger:#C2372B;
    --danger-soft:#FBEAE8;
  }
  html[data-theme="dark"]{
    --bg:#0A0C13;
    --surface:#141826;
    --ink:#F2F3F7;
    --muted:#8B90A6;
    --accent:#6C87FF;
    --accent-soft:rgba(108,135,255,0.14);
    --line:#242A3D;
    --particle:rgba(108,135,255,0.35);
    --danger:#FF6B5E;
    --danger-soft:rgba(255,107,94,0.12);
  }

  :root{ --radius:14px; }

  *{box-sizing:border-box; margin:0; padding:0;}

  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .3s ease, color .3s ease;
  }

  #particles{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  .screen{
    position:relative;
    z-index:1;
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:24px 20px 110px;
  }

  #shopScreen.hide, #cartScreen.hide, #adminScreen.hide{
    display:none;
  }

  .topbar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:6px;
  }
  .icon-btn{
    width:38px; height:38px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .hero{ margin-bottom:20px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }

  .wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(2.1rem, 8vw, 2.5rem);
    letter-spacing:-0.01em;
    line-height:1.05;
    margin-bottom:10px;
  }

  .tagline{
    font-size:15px;
    line-height:1.5;
    color:var(--muted);
    max-width:36ch;
  }

  .search-wrap{ position:relative; margin-bottom:14px; }
  .search-input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 16px 13px 42px;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-input:focus{ border-color:var(--accent); }
  .search-icon{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:15px; pointer-events:none;
  }
  .search-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:var(--muted); margin-bottom:16px;
  }

  .filter-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px;
  }

  .chip-strip{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:4px; margin-bottom:18px; scrollbar-width:none;
  }
  .chip-strip::-webkit-scrollbar{ display:none; }

  .chip{
    flex:0 0 auto;
    font-family:'Inter', sans-serif; font-weight:500; font-size:13px;
    color:var(--ink); background:var(--surface); border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .chip:active{ transform:scale(0.96); }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:var(--bg); }

  .catalog{ display:flex; flex-direction:column; gap:12px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
    transition:background .3s ease, border-color .3s ease;
  }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; gap:8px; }
  .card-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px; }

  .card-meta{ font-size:13px; color:var(--muted); margin-bottom:14px; }

  .stock-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .stock-tag.out{ background:var(--danger-soft); color:var(--danger); }

  .card-bottom{ display:flex; justify-content:space-between; align-items:center; }
  .card-price{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:17px; }

  .btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:14px;
    color:#fff; background:var(--accent); border:none;
    padding:10px 18px; border-radius:10px; cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.96); opacity:.9; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .btn-outline{
    background:none; color:var(--ink); border:1px solid var(--line);
  }
  .btn-danger{ background:var(--danger); }

  .empty{ text-align:center; color:var(--muted); font-size:14px; padding:40px 0; }

  .trust{
    display:flex; justify-content:center; gap:8px;
    color:var(--muted); font-size:12px; margin-top:26px;
  }

  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center;

    background:linear-gradient(to top, var(--bg) 60%, transparent);
    transform:translateY(120%); transition:transform .25s ease; z-index:20;

    width:100%; max-width:420px; background:var(--ink); color:var(--bg);

  .cart-bar-right{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15px; }

  .page-header{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .back-btn{
    background:var(--surface); border:1px solid var(--line); width:36px; height:36px;

  .page-header .wordmark{ font-size:1.5rem; margin-bottom:0; }

  .section-title{

    text-transform:uppercase; color:var(--muted); margin:22px 0 10px;

  .cart-list{ display:flex; flex-direction:column; gap:14px; }

  .cart-item-name{ font-weight:500; font-size:14px; margin-bottom:2px; }
  .cart-item-unit{ font-size:12px; color:var(--muted); }

  .cart-empty{ text-align:center; color:var(--muted); font-size:14px; padding:50px 0; }

  .summary-row{ display:flex; justify-content:space-between; font-size:14px; color:var(--muted); padding:6px 0; }

  }

  .admin-lock{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; text-align:center;
  }
  .admin-lock p{ font-size:13px; color:var(--muted); margin-bottom:14px; }

  .field{
    width:100%; font-family:'Inter', sans-serif; font-size:14px; color:var(--ink);

    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:12px;
  }

  .admin-row label{ font-size:11px; color:var(--muted); width:64px; flex:0 0 auto; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translate(-50%, 20px);
    background:var(--ink); color:var(--bg); font-size:13px; font-weight:500;
    padding:12px 20px; border-radius:10px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; max-width:80%; text-align:center; z-index:40;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>

/* ---------- Thème ---------- */
function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
}
themeBtn.onclick = toggleTheme;

/* ---------- Particules ---------- */
(function initParticles(){
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let w, h, dots = [];
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function seed(){
    const count = Math.min(60, Math.floor((w*h)/22000));
    dots = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25
    }));
  }
  function color(){
    return getComputedStyle(document.documentElement).getPropertyValue("--particle").trim();
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const c = color();
    dots.forEach(d => {
      if(!reduced){
        d.x += d.vx; d.y += d.vy;
        if(d.x < 0 || d.x > w) d.vx *= -1;
        if(d.y < 0 || d.y > h) d.vy *= -1;
      }
      ctx.beginPath();
      ctx.arc(d.x, d.y, 1.6, 0, Math.PI*2);
      ctx.fillStyle = c;
      ctx.fill();
    });
    for(let i=0;i<dots.length;i++){
      for(let j=i+1;j<dots.length;j++){
        const dx = dots[i].x-dots[j].x, dy = dots[i].y-dots[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 110){
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = c;
          ctx.globalAlpha = 1 - dist/110;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
    if(!reduced) requestAnimationFrame(draw);
  }
  window.addEventListener("resize", () => { resize(); seed(); });
  resize(); seed(); draw();
})();

/* ---------- Données produits ---------- */
function loadProducts(){
  if(firebaseReady){
    statusBanner.innerHTML = "";
    db.ref("products").on("value", snap => {
      const val = snap.val() || {};
      products = Object.entries(val).map(([id, p]) => ({ id, ...p }));
      renderCountryStrip();
      renderCatalog();
    });
  } else {
    statusBanner.innerHTML = '<div class="banner">Mode démo — connecte Firebase (voir instructions) pour un stock en temps réel et modifiable depuis l\'admin.</div>';
    products = SEED_PRODUCTS.map((p, i) => ({ id: "seed-" + i, ...p }));
    renderCountryStrip();
    renderCatalog();
  }
}

function allCountries(){
  const set = new Set();
  products.forEach(d => (d.countries || []).forEach(c => set.add(c)));
  return Array.from(set).sort();
}

function renderCountryStrip(){
  const countries = ["all", ...allCountries()];
  countryStripEl.innerHTML = "";
  countries.forEach(code => {
    const btn = document.createElement("button");
    btn.className = "chip" + (code === activeCountry ? " active" : "");
    btn.textContent = code === "all" ? "Tous" : (FLAGS[code] || code);
    btn.onclick = () => { activeCountry = code; renderCountryStrip(); renderCatalog(); };
    countryStripEl.appendChild(btn);
  });
}

function filteredProducts(){
  const q = query.trim().toLowerCase();
  return products.filter(d =>
    (q === "" || d.domain.toLowerCase().includes(q)) &&
    (activeCountry === "all" || (d.countries || []).includes(activeCountry))
  );
}

function renderCatalog(){
  const items = filteredProducts();
  searchCount.textContent = items.length + (items.length > 1 ? " accès trouvés" : " accès trouvé");
  catalogEl.innerHTML = "";

  if(items.length === 0){
    catalogEl.innerHTML = '<p class="empty">Aucun accès ne correspond à ta recherche.</p>';
    return;
  }

  items.forEach(d => {
    const stock = Number(d.stock || 0);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">@${d.domain}</div>
        <span class="stock-tag ${stock <= 0 ? 'out' : ''}">${stock > 0 ? stock + ' en stock' : 'Épuisé'}</span>
      </div>
      <div class="card-meta">Disponible : ${(d.countries||[]).map(c => FLAGS[c] || c).join(" · ")}</div>
      <div class="card-bottom">
        <div class="card-price">${fmt(Number(d.price))}</div>
        <button class="btn" ${stock <= 0 ? "disabled" : ""}>Ajouter au panier</button>
      </div>
    `;
    card.querySelector(".btn").onclick = () => addToCart(d);
    catalogEl.appendChild(card);
  });
}

/* ---------- Panier ---------- */
function addToCart(item){
  const stock = Number(item.stock || 0);
  const inCart = cart[item.id] || 0;
  if(inCart >= stock){
    showToast("Stock maximum atteint pour cet accès.");
    return;
  }
  cart[item.id] = inCart + 1;
  try{ if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.HapticFeedback.impactOccurred("light"); }catch(e){}
  showToast(`"@${item.domain}" ajouté au panier.`);
  renderCartBar();
}

function changeQty(productId, delta){
  const product = products.find(p => p.id === productId);
  const stock = product ? Number(product.stock || 0) : 0;
  let next = (cart[productId] || 0) + delta;
  if(next > stock) next = stock;
  if(next <= 0) delete cart[productId]; else cart[productId] = next;
  renderCartBar();
  renderCartPage();
}

function cartEntries(){
  return Object.entries(cart).map(([id, qty]) => {
    const item = products.find(p => p.id === id);
    return { item, qty };
  }).filter(e => e.item);
}
function cartTotal(){ return cartEntries().reduce((s,e) => s + e.item.price*e.qty, 0); }
function cartCount(){ return cartEntries().reduce((s,e) => s + e.qty, 0); }

function renderCartBar(){
  const count = cartCount();
  if(count === 0){ cartBar.classList.remove("show"); return; }
  cartBar.classList.add("show");
  cartBarCount.textContent = count + (count > 1 ? " articles" : " article");
  cartBarTotal.textContent = fmt(cartTotal());
}

function renderCartPage(){
  const entries = cartEntries();
  cartList.innerHTML = "";
  if(entries.length === 0){
    cartList.innerHTML = '<p class="cart-empty">Ton panier est vide.</p>';
    summaryBlock.innerHTML = ""; payBlock.innerHTML = "";
    return;
  }
  entries.forEach(({ item, qty }) => {
    const row = document.createElement("div");
    row.className = "cart-item";
    row.innerHTML = `
      <div>
        <div class="cart-item-name">@${item.domain}</div>
        <div class="cart-item-unit">${fmt(item.price)} / unité</div>
      </div>
      <div class="stepper">
        <button data-delta="-1">−</button>
        <span>${qty}</span>
        <button data-delta="1">+</button>
      </div>
    `;
    row.querySelectorAll("button").forEach(btn => {
      btn.onclick = () => changeQty(item.id, parseInt(btn.dataset.delta));
    });
    cartList.appendChild(row);
  });

  summaryBlock.innerHTML = `
    <p class="section-title">Résumé</p>
    <div class="summary-row"><span>Articles</span><span>${cartCount()}</span></div>
    <div class="summary-row total"><span>Total</span><span>${fmt(cartTotal())}</span></div>
  `;

  payBlock.innerHTML = `
    <p class="section-title">Paiement</p>
    <div class="pay-card">
      <span class="pay-network">${CRYPTO_CONFIG.network}</span>
      <div class="pay-address">
        <span>${CRYPTO_CONFIG.address}</span>
        <button class="copy-btn" id="copyBtn">Copier</button>
      </div>
      <p class="pay-note">Envoie le montant exact à cette adresse, puis confirme ci-dessous.</p>
      <button class="btn" id="confirmPayBtn" style="width:100%; padding:14px;">J'ai envoyé le paiement</button>
    </div>
  `;
  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(CRYPTO_CONFIG.address).then(() => showToast("Adresse copiée."));
  };
  document.getElementById("confirmPayBtn").onclick = () => {
    // Décrémente le stock en temps réel si Firebase est connecté
    if(firebaseReady){
      cartEntries().forEach(({ item, qty }) => {
        db.ref("products/" + item.id + "/stock").set(Math.max(0, Number(item.stock||0) - qty));
      });
    }
    try{ if(window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.HapticFeedback.notificationOccurred("success"); }catch(e){}
    showToast("Confirmation envoyée — l'assistant va vérifier le paiement.");
    cart = {};
    renderCartBar();
    goToShop();
  };
}

/* ---------- Navigation ---------- */
function goToCart(){ renderCartPage(); shopScreen.classList.add("hide"); adminScreen.classList.add("hide"); cartScreen.classList.remove("hide"); window.scrollTo(0,0); }
function goToShop(){ cartScreen.classList.add("hide"); adminScreen.classList.add("hide"); shopScreen.classList.remove("hide"); window.scrollTo(0,0); }
function goToAdmin(){ shopScreen.classList.add("hide"); cartScreen.classList.add("hide"); adminScreen.classList.remove("hide"); renderAdmin(); window.scrollTo(0,0); }

document.getElementById("cartBarInner").onclick = goToCart;
backBtn.onclick = goToShop;
adminBackBtn.onclick = goToShop;
adminBtn.onclick = goToAdmin;

searchInput.addEventListener("input", () => { query = searchInput.value; renderCatalog(); });

/* ---------- Admin ---------- */
function renderAdmin(){
  if(!isAdminUnlocked){
    adminContent.innerHTML = `
      <div class="admin-lock">
        <p>Accès protégé. Entre le mot de passe admin pour gérer le stock.</p>
        <input class="field" id="pwField" type="password" placeholder="Mot de passe">
        <button class="btn" id="pwBtn" style="width:100%;">Déverrouiller</button>
      </div>
    `;
    document.getElementById("pwBtn").onclick = () => {
      const val = document.getElementById("pwField").value;
      if(val === ADMIN_PASSWORD){ isAdminUnlocked = true; renderAdmin(); }
      else showToast("Mot de passe incorrect.");
    };
    return;
  }

  if(!firebaseReady){
    adminContent.innerHTML = '<div class="banner">Firebase n\'est pas encore connecté — configure-le pour pouvoir gérer le stock en temps réel (voir instructions).</div>';
    return;
  }

  let html = "";

  if(products.length === 0){
    html += `<button class="btn" id="importBtn" style="width:100%; margin-bottom:16px;">Importer le catalogue de départ</button>`;
  }

  html += `
    <p class="section-title">Ajouter un accès</p>
    <div class="admin-card">
      <input class="field" id="newDomain" placeholder="Domaine (ex: hotmail.com)">
      <input class="field" id="newCountries" placeholder="Pays, séparés par des virgules (ex: FR,US,DE)">
      <input class="field" id="newPrice" type="number" step="0.01" placeholder="Prix (${CURRENCY})">
      <input class="field" id="newStock" type="number" placeholder="Stock">
      <button class="btn" id="addBtn" style="width:100%;">Ajouter</button>
    </div>
    <p class="section-title">Catalogue (${products.length})</p>
    <div id="adminList"></div>
  `;

  adminContent.innerHTML = html;

  const importBtn = document.getElementById("importBtn");
  if(importBtn){
    importBtn.onclick = () => {
      const updates = {};
      SEED_PRODUCTS.forEach(p => {
        const ref = db.ref("products").push();
        updates[ref.key] = p;
      });
      db.ref("products").update(updates).then(() => showToast("Catalogue importé."));
    };
  }

  document.getElementById("addBtn").onclick = () => {
    const domain = document.getElementById("newDomain").value.trim();
    const countries = document.getElementById("newCountries").value.split(",").map(c => c.trim().toUpperCase()).filter(Boolean);
    const price = parseFloat(document.getElementById("newPrice").value);
    const stock = parseInt(document.getElementById("newStock").value);
    if(!domain || countries.length === 0 || isNaN(price) || isNaN(stock)){
      showToast("Remplis tous les champs correctement.");
      return;
    }
    db.ref("products").push({ domain, countries, price, stock }).then(() => {
      showToast("Accès ajouté.");
      document.getElementById("newDomain").value = "";
      document.getElementById("newCountries").value = "";
      document.getElementById("newPrice").value = "";
      document.getElementById("newStock").value = "";
    });
  };

  const listEl = document.getElementById("adminList");
  products.forEach(p => {
    const row = document.createElement("div");
    row.className = "admin-card";
    row.innerHTML = `
      <div class="card-title" style="margin-bottom:10px;">@${p.domain}</div>
      <div class="admin-row"><label>Pays</label><input class="field" value="${(p.countries||[]).join(',')}" data-field="countries"></div>
      <div class="admin-row"><label>Prix</label><input class="field" type="number" step="0.01" value="${p.price}" data-field="price"></div>
      <div class="admin-row"><label>Stock</label><input class="field" type="number" value="${p.stock}" data-field="stock"></div>
      <div class="admin-actions">
        <button class="btn" data-action="save">Enregistrer</button>
        <button class="btn btn-danger" data-action="delete">Supprimer</button>
      </div>
    `;
    row.querySelector('[data-action="save"]').onclick = () => {
      const countries = row.querySelector('[data-field="countries"]').value.split(",").map(c => c.trim().toUpperCase()).filter(Boolean);
      const price = parseFloat(row.querySelector('[data-field="price"]').value);
      const stock = parseInt(row.querySelector('[data-field="stock"]').value);
      db.ref("products/" + p.id).update({ countries, price, stock }).then(() => showToast("Mis à jour."));
    };
    row.querySelector('[data-action="delete"]').onclick = () => {
      if(confirm(`Supprimer @${p.domain} ?`)){
        db.ref("products/" + p.id).remove().then(() => showToast("Supprimé."));
      }
    };
    listEl.appendChild(row);
  });
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

loadProducts();
renderCartBar();

try{
  if(window.Telegram && window.Telegram.WebApp){
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
  }
}catch(e){}
</script>

</body>
</html>
